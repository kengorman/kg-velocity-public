<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unified Journey Movie</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; height: 100dvh; }
  canvas { display: block; }
  #overlay {
    position: fixed; bottom: 40px; left: 0; right: 0;
    text-align: center; font-family: 'Segoe UI', system-ui, sans-serif;
    pointer-events: none; z-index: 10;
  }
  #trip-data {
    display: inline-block; padding: 20px 32px;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.8s ease;
  }
  #trip-data.visible { opacity: 1; }
  #trip-data h2 { color: #fff; font-size: 16px; font-weight: 300; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
  #trip-data .stats { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  #trip-data .stat { text-align: center; }
  #trip-data .stat .value { color: #7eb8ff; font-size: 20px; font-weight: 600; }
  #trip-data .stat .label { color: rgba(255,255,255,0.5); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  #controls {
    position: fixed; top: 20px; right: 20px; z-index: 20;
    display: flex; gap: 8px; align-items: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #dest-select {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 8px 12px; border-radius: 6px;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
  }
  #dest-select option { background: #1a1a2e; color: #fff; }
  #restart {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
  }
  #restart:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div id="trip-data">
    <h2 id="trip-heading"></h2>
    <div class="stats">
      <div class="stat"><div class="value" id="stat-dist">—</div><div class="label">Distance</div></div>
    </div>
  </div>
</div>
<div id="controls">
  <select id="dest-select"></select>
  <button id="restart" onclick="launchTo(document.getElementById('dest-select').value)">Go</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// =============================================================
// CONSTANTS
// =============================================================
const AU_TO_LY = 1.581e-5;
const EARTH_AU = 1.0;
const EARTH_LY = EARTH_AU * AU_TO_LY;

// =============================================================
// DESTINATIONS — all 15 from the app catalog
// au: distance from Sun in AU (solar system only)
// ly: distance from Sun in light-years (used for coordinate mapping)
// distLabel: shown in trip data panel
// category: solar | milkyway | extragalactic
// =============================================================
const DESTINATIONS = {
  'The Moon':            { au: 1.15,   ly: 1.15 * AU_TO_LY,        distLabel: '239K mi',     category: 'solar' },
  'Mercury':             { au: 0.39,   ly: 0.39 * AU_TO_LY,        distLabel: '56M mi',      category: 'solar' },
  'The Sun':             { au: 0,      ly: 0,                       distLabel: '93M mi',      category: 'solar' },
  'Mars':                { au: 1.52,   ly: 1.52 * AU_TO_LY,        distLabel: '140M mi',     category: 'solar' },
  'Jupiter':             { au: 5.2,    ly: 5.2 * AU_TO_LY,         distLabel: '484M mi',     category: 'solar' },
  'Saturn':              { au: 9.5,    ly: 9.5 * AU_TO_LY,         distLabel: '886M mi',     category: 'solar' },
  'Pluto':               { au: 39.5,   ly: 39.5 * AU_TO_LY,        distLabel: '3.7B mi',     category: 'solar' },
  'Proxima Centauri':    { au: null,   ly: 4.24,                    distLabel: '4.24 ly',     category: 'milkyway' },
  'Polaris':             { au: null,   ly: 433,                     distLabel: '433 ly',      category: 'milkyway' },
  'Betelgeuse':          { au: null,   ly: 700,                     distLabel: '700 ly',      category: 'milkyway' },
  'Horsehead Nebula':    { au: null,   ly: 1500,                    distLabel: '1,500 ly',    category: 'milkyway' },
  'Crab Nebula':         { au: null,   ly: 6500,                    distLabel: '6,500 ly',    category: 'milkyway' },
  'Pillars of Creation': { au: null,   ly: 6500,                    distLabel: '6,500 ly',    category: 'milkyway' },
  'Milky Way Center':    { au: null,   ly: 26000,                   distLabel: '26,000 ly',   category: 'milkyway' },
  'Andromeda Galaxy':    { au: null,   ly: 2537000,                 distLabel: '2.537M ly',   category: 'extragalactic' },
};

let currentDest = 'Saturn';

// =============================================================
// UNIFIED COORDINATE SYSTEM
// Hybrid approach:
//   - Planetary band (< 0.001 ly): linear in AU for visual spacing
//   - Beyond: log10(ly) for even distribution across huge distances
//
// The Y-axis maps distance-from-Sun to a normalized position.
// Sun is at y=0. Earth is at y = auToY(1.0). Outward = higher y.
// This keeps Sun below Earth always.
// =============================================================
const PLANETARY_THRESHOLD_LY = 0.001;     // ~63 AU — beyond Pluto
const PLANETARY_THRESHOLD_AU = PLANETARY_THRESHOLD_LY / AU_TO_LY;
const AU_SCALE = 1.0;                     // 1 AU = 1 world unit in planetary band
const LOG_OFFSET = PLANETARY_THRESHOLD_AU * AU_SCALE; // where log band begins on the Y-axis

// Convert AU to Y position (planetary band, linear)
function auToY(au) {
  return au * AU_SCALE;
}

// Convert light-years to Y position (unified, hybrid)
function lyToY(ly) {
  if (ly <= 0) return 0;
  if (ly < PLANETARY_THRESHOLD_LY) {
    // Planetary band: convert to AU, use linear
    return (ly / AU_TO_LY) * AU_SCALE;
  }
  // Log band: log10 starting from threshold, offset above planetary band
  return LOG_OFFSET + (Math.log10(ly) - Math.log10(PLANETARY_THRESHOLD_LY)) * 15;
  // The *15 multiplier spreads the log band across enough world-units for visual separation
}

// Get the Y position for any destination
function destToY(dest) {
  if (dest.au !== null) return auToY(dest.au);
  return lyToY(dest.ly);
}

// =============================================================
// LAYER 1: PLANETS (Sun through Pluto)
// Positioned by AU along Y-axis. Sun at bottom (y=0), outward = up.
// Same data as the solar system template.
// =============================================================
const planets = [
  { name: 'Sun',     au: 0,     baseR: 22, color: '#FDB813', glow: '#FDB81350', ring: false },
  { name: 'Mercury', au: 0.39,  baseR: 2,  color: '#8c7e6d', glow: null,         ring: false },
  { name: 'Venus',   au: 0.72,  baseR: 4.8,color: '#c9a860', glow: null,         ring: false },
  { name: 'Earth',   au: 1.0,   baseR: 5,  color: '#4a90d9', glow: '#4a90d940',  ring: false },
  { name: 'Moon',    au: 1.15,  baseR: 1.2,color: '#aaa9a5', glow: null,         ring: false },
  { name: 'Mars',    au: 1.52,  baseR: 3,  color: '#c1440e', glow: null,         ring: false },
  { name: 'Jupiter', au: 5.2,   baseR: 14, color: '#c88b3a', glow: '#c88b3a20',  ring: false },
  { name: 'Saturn',  au: 9.5,   baseR: 12, color: '#d4a94b', glow: '#d4a94b30',  ring: true },
  { name: 'Uranus',  au: 19.2,  baseR: 6,  color: '#7ec8c8', glow: '#7ec8c820',  ring: false },
  { name: 'Neptune', au: 30.1,  baseR: 5.8,color: '#3f54ba', glow: '#3f54ba20',  ring: false },
  { name: 'Pluto',   au: 39.5,  baseR: 1.2,color: '#c4b59a', glow: null,         ring: false },
];

// Precompute Y positions for planets
for (const p of planets) {
  p.y = auToY(p.au);
}

// =============================================================
// LAYER 3: GALACTIC LANDMARKS (Proxima through MW Center)
// From the milky way template. Log-positioned on Y-axis.
// Slight X offsets so labels don't stack on center axis.
// =============================================================
const galacticLandmarks = [
  { name: 'Proxima Centauri',    ly: 4.24,   baseR: 4,  color: '#ff6b4a', glow: '#ff6b4a30', xOff:  0.8 },
  { name: 'Polaris',             ly: 433,    baseR: 5,  color: '#fffbe0', glow: '#fffbe040', xOff: -0.8 },
  { name: 'Betelgeuse',          ly: 700,    baseR: 7,  color: '#ff4500', glow: '#ff450040', xOff:  1.0 },
  { name: 'Horsehead Nebula',    ly: 1500,   baseR: 6,  color: '#8b4585', glow: '#8b458540', xOff: -1.0 },
  { name: 'Crab Nebula',         ly: 6500,   baseR: 6,  color: '#4ecdc4', glow: '#4ecdc430', xOff:  0.8 },
  { name: 'Pillars of Creation', ly: 6500,   baseR: 6,  color: '#c79a3e', glow: '#c79a3e30', xOff: -0.8 },
  { name: 'Milky Way Center',    ly: 26000,  baseR: 8,  color: '#ffd700', glow: '#ffd70050', xOff:  0 },
];

// Precompute Y positions
for (const obj of galacticLandmarks) {
  obj.y = lyToY(obj.ly);
}
// Nudge Pillars apart from Crab (same ly)
const pillars = galacticLandmarks.find(o => o.name === 'Pillars of Creation');
if (pillars) pillars.y += 1.5;

// =============================================================
// LAYER 4: MILKY WAY SPIRAL
// Procedural spiral galaxy. 4 arms, 400 stars per arm.
// Centered so Earth/Solar System sits in an outer arm.
// From the extragalactic template.
// =============================================================
const MW_CENTER_Y = lyToY(26000);  // Milky Way center Y position
const MW_CENTER_X = 0;
const spiralStars = [];
const MW_ARM_COUNT = 4;
const MW_STARS_PER_ARM = 400;

for (let arm = 0; arm < MW_ARM_COUNT; arm++) {
  const armOffset = (arm / MW_ARM_COUNT) * Math.PI * 2;
  for (let i = 0; i < MW_STARS_PER_ARM; i++) {
    const t = i / MW_STARS_PER_ARM;
    const angle = armOffset + t * Math.PI * 2.5;
    const radius = 1 + t * 20;  // world units radius in the log band
    const spread = 0.5 + t * 3;
    const r = radius + (Math.random() - 0.5) * spread;
    const a = angle + (Math.random() - 0.5) * 0.4;
    // Center the spiral on the MW center, with Earth in an outer arm
    const earthY = lyToY(EARTH_LY);
    const mwMidY = (earthY + MW_CENTER_Y) / 2;
    spiralStars.push({
      x: MW_CENTER_X + r * Math.cos(a),
      y: mwMidY + r * Math.sin(a) * 0.4,  // compressed vertically (tilted view)
      brightness: 0.3 + Math.random() * 0.7,
      size: 0.3 + Math.random() * 1.2,
      twinkleSpeed: 0.3 + Math.random() * 1,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
}

// =============================================================
// LAYER 5: ANDROMEDA GALAXY
// Procedural spiral. 3 arms, 150 stars each.
// Positioned above the Milky Way in the coordinate space.
// From the extragalactic template.
// =============================================================
const ANDROMEDA_Y = lyToY(2537000);
const ANDROMEDA_X = 1.5;  // slight offset for visual interest
const andromedaStars = [];

for (let arm = 0; arm < 3; arm++) {
  const armOffset = (arm / 3) * Math.PI * 2;
  for (let i = 0; i < 150; i++) {
    const t = i / 150;
    const angle = armOffset + t * Math.PI * 2;
    const radius = 0.3 + t * 5;
    const spread = 0.2 + t * 1.5;
    const r = radius + (Math.random() - 0.5) * spread;
    const a = angle + (Math.random() - 0.5) * 0.5;
    andromedaStars.push({
      x: ANDROMEDA_X + r * Math.cos(a),
      y: ANDROMEDA_Y + r * Math.sin(a) * 0.5,
      brightness: 0.2 + Math.random() * 0.6,
      size: 0.3 + Math.random() * 0.8,
      twinkleSpeed: 0.3 + Math.random() * 1,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
}

// =============================================================
// BACKGROUND STARS — 3 parallax layers (~1,050 total)
// Always present at all zoom levels. Lower parallax = farther/slower.
// =============================================================
const starLayerDefs = [
  { count: 500, spread: 200, parallax: 0.1 },
  { count: 350, spread: 120, parallax: 0.2 },
  { count: 200, spread: 60,  parallax: 0.4 },
];
const starLayers = [];
for (const def of starLayerDefs) {
  const stars = [];
  for (let i = 0; i < def.count; i++) {
    stars.push({
      x: (Math.random() - 0.5) * def.spread,
      y: Math.random() * def.spread,
      brightness: 0.2 + Math.random() * 0.8,
      size: 0.5 + Math.random() * 1.2,
      twinkleSpeed: 1 + Math.random() * 3,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
  starLayers.push({ stars, parallax: def.parallax });
}

// =============================================================
// CAMERA STATE
// =============================================================
let camX, camY, camZoom;
let cssWidth, cssHeight;

// =============================================================
// COORDINATE CONVERSION
// World (x, y) to screen pixels. Y-axis inverted: higher y = higher on screen.
// =============================================================
function toScreen(worldX, worldY, parallax = 1.0) {
  const dx = (worldX - camX) * parallax;
  const dy = (worldY - camY) * parallax;
  return {
    x: cssWidth / 2 + dx * camZoom,
    y: cssHeight / 2 - dy * camZoom,
  };
}

// =============================================================
// HIGH-DPI CANVAS RESIZE
// =============================================================
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cssWidth = window.innerWidth;
  cssHeight = window.innerHeight;
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  canvas.style.width = cssWidth + 'px';
  canvas.style.height = cssHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// =============================================================
// EASING
// easeInCubicOut: cubic ease-in (85%), quadratic ease-out (15%)
// =============================================================
function easeInCubicOut(t) {
  if (t < 0.85) {
    const st = t / 0.85;
    return 0.85 * (st * st * st);
  }
  const st = (t - 0.85) / 0.15;
  return 0.85 + 0.15 * (1 - Math.pow(1 - st, 2));
}

// =============================================================
// CAMERA FRAMING — computed per destination
// Camera starts tight on Earth, zooms out to frame Earth + destination.
// Duration scales with log-distance for constant perceptual zoom speed.
// =============================================================
let holdState, finalState, LOG_ZOOM_START, LOG_ZOOM_END;
let animDuration = 6000;

function computeAnimParams(destName) {
  const dest = DESTINATIONS[destName];
  const earthY = auToY(EARTH_AU);
  const destY = destToY(dest);
  const screenH = cssHeight || 800;

  // --- Duration: scales with log-distance, floor 4s, cap 8s ---
  const earthLy = EARTH_LY;
  const destLy = dest.ly;
  const distLy = Math.abs(destLy - earthLy);
  // Log range from ~0 (Moon) to ~6.4 (Andromeda)
  const logDist = distLy > 0.0001 ? Math.log10(distLy) : -4;
  // Map log-distance to duration: -7 (Moon) → 4s, 6.4 (Andromeda) → 8s
  const minLog = -7;
  const maxLog = 6.5;
  const t = Math.max(0, Math.min(1, (logDist - minLog) / (maxLog - minLog)));
  animDuration = Math.round(4000 + t * 4000);  // 4s to 8s

  // --- Starting camera: tight on Earth ---
  const startZoom = 600;  // px per world-unit (tight on Earth at 1 AU)
  holdState = { cx: 0, cy: earthY, zoom: startZoom };

  // --- Final camera: framed so ALL objects clear the trip data panel ---
  // PANEL_MARGIN: pixels reserved at bottom for the trip data overlay
  // TOP_MARGIN: pixels reserved at top of viewport
  // The lowest visible object must sit ABOVE the panel.
  const PANEL_MARGIN = 160;
  const TOP_MARGIN = 40;
  const usableH = screenH - PANEL_MARGIN - TOP_MARGIN;

  // Determine the lowest and highest Y world-coords that must be visible
  let lowestY, highestY;
  if (dest.category === 'solar') {
    // Always show Sun (y=0) through destination or Earth, whichever is higher
    lowestY = 0;
    highestY = Math.max(earthY, destY);
  } else {
    // Show Earth through destination
    lowestY = Math.min(earthY, destY);
    highestY = Math.max(earthY, destY);
  }
  const totalSpan = Math.max(highestY - lowestY, 0.5);

  const finalZoom = Math.max(0.5, Math.min(startZoom, usableH / totalSpan));

  // Position camera so the lowest object sits just above the panel.
  // Screen Y of lowest object = cssHeight/2 - (lowestY - camY) * zoom
  // We want that screen Y = cssHeight - PANEL_MARGIN
  // Solving: camY = lowestY + (cssHeight/2 - PANEL_MARGIN) / zoom
  const finalCY = lowestY + (screenH / 2 - PANEL_MARGIN) / finalZoom;

  finalState = { cx: 0, cy: finalCY, zoom: finalZoom };

  LOG_ZOOM_START = Math.log(holdState.zoom);
  LOG_ZOOM_END = Math.log(finalState.zoom);
}

// =============================================================
// CAMERA ANIMATION
// Log-space zoom interpolation with easeInCubicOut.
// Pan clamped so Earth never exits viewport bottom.
// =============================================================
function getCameraState(progress) {
  const e = easeInCubicOut(progress);
  const logZoom = LOG_ZOOM_START + (LOG_ZOOM_END - LOG_ZOOM_START) * e;
  const zoom = Math.exp(logZoom);

  // Clamp pan so Earth never drops below viewport
  const earthY = auToY(EARTH_AU);
  const bottomMargin = 60;
  const maxCY = earthY + (cssHeight / 2 - bottomMargin) / zoom;
  const rawCY = holdState.cy + (finalState.cy - holdState.cy) * e;
  const cy = Math.min(rawCY, maxCY);

  return {
    cx: holdState.cx + (finalState.cx - holdState.cx) * e,
    cy: cy,
    zoom: zoom,
  };
}

// =============================================================
// LOD ALPHA VALUES — computed per frame based on zoom
// Layer 1 (planets): visible when zoom is high (planets are big)
// Layer 2 (SS icon): cross-fades with Layer 1
// Layer 3 (galactic landmarks): visible at medium-low zoom
// Layer 4 (MW spiral): visible at low zoom
// Layer 5 (Andromeda): visible at very low zoom, only for that destination
// =============================================================
let planetAlpha = 1;
let ssIconAlpha = 0;
let landmarkAlpha = 0;
let mwSpiralAlpha = 0;
let andromedaAlpha = 0;

function computeLODAlphas(zoom, progress) {
  // Layer 1 → 2 crossfade: planets fade when Earth's baseR (5) * zoom/60 < ~3px
  // That's when zoom < ~36. Fade over a range.
  const planetFadeStart = 40;  // planets start fading
  const planetFadeEnd = 15;    // planets fully gone
  if (zoom >= planetFadeStart) {
    planetAlpha = 1;
    ssIconAlpha = 0;
  } else if (zoom <= planetFadeEnd) {
    planetAlpha = 0;
    ssIconAlpha = 1;
  } else {
    const t = (zoom - planetFadeEnd) / (planetFadeStart - planetFadeEnd);
    planetAlpha = t;
    ssIconAlpha = 1 - t;
  }

  // Layer 3: galactic landmarks fade in when zoom drops low enough
  // that the solar system icon is small and we can see light-year scales
  const landmarkFadeStart = 8;
  const landmarkFadeEnd = 3;
  if (zoom >= landmarkFadeStart) {
    landmarkAlpha = 0;
  } else if (zoom <= landmarkFadeEnd) {
    landmarkAlpha = 1;
  } else {
    landmarkAlpha = 1 - (zoom - landmarkFadeEnd) / (landmarkFadeStart - landmarkFadeEnd);
  }

  // Layer 4: MW spiral fades in at very low zoom
  const mwFadeStart = 2;
  const mwFadeEnd = 0.5;
  if (zoom >= mwFadeStart) {
    mwSpiralAlpha = 0;
  } else if (zoom <= mwFadeEnd) {
    mwSpiralAlpha = 1;
  } else {
    mwSpiralAlpha = 1 - (zoom - mwFadeEnd) / (mwFadeStart - mwFadeEnd);
  }

  // Layer 5: Andromeda — only for that destination, fades in at lowest zoom
  if (currentDest !== 'Andromeda Galaxy') {
    andromedaAlpha = 0;
  } else {
    const andFadeStart = 0.3;
    const andFadeEnd = 0.1;
    if (zoom >= andFadeStart) {
      andromedaAlpha = 0;
    } else if (zoom <= andFadeEnd) {
      andromedaAlpha = 1;
    } else {
      andromedaAlpha = 1 - (zoom - andFadeEnd) / (andFadeStart - andFadeEnd);
    }
  }
}

// =============================================================
// ARRIVAL HIGHLIGHT
// Ramps from 0 to 1 between progress 0.75 and 0.90
// =============================================================
let arrivalAmount = 0;

// =============================================================
// DRAW: BACKGROUND STARS (always present, 3 parallax layers)
// =============================================================
function drawStars(time) {
  for (const layer of starLayers) {
    for (const star of layer.stars) {
      const pos = toScreen(star.x, star.y, layer.parallax);
      if (pos.x < -10 || pos.x > cssWidth + 10 || pos.y < -10 || pos.y > cssHeight + 10) continue;
      const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
      const alpha = star.brightness * (0.4 + 0.6 * twinkle);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, star.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();
    }
  }
}

// =============================================================
// DRAW: LAYER 1 — PLANETS
// From the solar system template: dots, glows, Saturn rings, labels.
// Multiplied by planetAlpha for LOD cross-fade.
// =============================================================
function drawPlanets(time) {
  if (planetAlpha <= 0) return;

  ctx.save();
  ctx.globalAlpha = planetAlpha;

  // Orbit hints (very faint circles around Sun)
  ctx.strokeStyle = `rgba(255,255,255,${0.04 * planetAlpha})`;
  ctx.lineWidth = 0.5;
  const sunScreen = toScreen(0, 0);
  for (const p of planets) {
    if (p.au === 0) continue;
    const r = p.au * AU_SCALE * camZoom;
    if (r > 5 && r < cssHeight * 3) {
      ctx.beginPath();
      ctx.arc(sunScreen.x, sunScreen.y, r, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Planets
  for (const planet of planets) {
    const pos = toScreen(0, planet.y);
    if (pos.x < -100 || pos.x > cssWidth + 100 || pos.y < -100 || pos.y > cssHeight + 100) continue;

    const r = planet.baseR * (camZoom / 60);
    const minR = planet.name === 'Sun' ? 4 : 1.5;
    const drawR = Math.max(minR, Math.min(r, planet.name === 'Sun' ? 60 : 30));

    const isDestPlanet = planet.name === currentDest ||
      (currentDest === 'The Moon' && planet.name === 'Moon') ||
      (currentDest === 'The Sun' && planet.name === 'Sun');

    // Arrival arrow
    if (isDestPlanet && arrivalAmount > 0) {
      const arrowX = pos.x - drawR - 14;
      const size = 5;
      ctx.fillStyle = `rgba(126, 184, 255, ${arrivalAmount * 0.9 * planetAlpha})`;
      ctx.beginPath();
      ctx.moveTo(arrowX + size, pos.y);
      ctx.lineTo(arrowX - size, pos.y - size);
      ctx.lineTo(arrowX - size, pos.y + size);
      ctx.closePath();
      ctx.fill();
    }

    // Glow
    if (planet.glow && drawR > 3) {
      const gradient = ctx.createRadialGradient(pos.x, pos.y, drawR, pos.x, pos.y, drawR * 3);
      gradient.addColorStop(0, planet.glow);
      gradient.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, drawR * 3, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    // Body
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, drawR, 0, Math.PI * 2);
    ctx.fillStyle = planet.color;
    ctx.fill();

    // Saturn rings
    if (planet.ring && drawR > 3) {
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, drawR * 2.2, drawR * 0.5, -0.2, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(210, 180, 120, ${0.6 * planetAlpha})`;
      ctx.lineWidth = Math.max(1, drawR * 0.25);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, drawR * 1.7, drawR * 0.38, -0.2, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(190, 160, 100, ${0.35 * planetAlpha})`;
      ctx.lineWidth = Math.max(0.5, drawR * 0.15);
      ctx.stroke();
    }

    // Label
    if (drawR > 2.5 || planet.name === 'Earth' || isDestPlanet) {
      const arrived = isDestPlanet && arrivalAmount > 0;
      const fontSize = arrived ? 18 : Math.max(14, Math.min(16, drawR * 1.2));
      ctx.font = `${arrived ? '600' : '400'} ${fontSize}px 'Segoe UI', system-ui, sans-serif`;
      ctx.fillStyle = arrived ? `rgba(126, 184, 255, ${(0.5 + arrivalAmount * 0.5) * planetAlpha})` :
                      isDestPlanet ? `rgba(126, 184, 255, ${0.8 * planetAlpha})` :
                      `rgba(255,255,255,${0.6 * planetAlpha})`;
      ctx.textAlign = 'left';
      ctx.fillText(planet.name, pos.x + drawR + 8, pos.y + 4);
    }
  }
  ctx.restore();
}

// =============================================================
// DRAW: LAYER 2 — SOLAR SYSTEM ICON
// Orbit-ring icon from the milky way / extragalactic templates.
// Positioned at Earth's location. Scales with zoom.
// Cross-fades with Layer 1 via ssIconAlpha.
// =============================================================
function drawSolarSystemIcon() {
  if (ssIconAlpha <= 0) return;

  const earthY = auToY(EARTH_AU);
  const pos = toScreen(0, earthY);
  const r = Math.max(3, Math.min(60, camZoom * 0.15));

  // Don't draw if icon is too tiny (entering galactic scale)
  if (r < 1.5) return;

  const orbits = [0.35, 0.55, 0.75, 1.0];
  const planetColors = ['#c1440e', '#c88b3a', '#d4a94b', '#3f54ba'];
  const planetSizes = [0.8, 1.4, 1.2, 0.9];

  ctx.save();
  ctx.globalAlpha = ssIconAlpha;

  for (let i = 0; i < orbits.length; i++) {
    const orbitR = r * orbits[i] * 2.5;

    // Orbit ring
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y, orbitR, orbitR * 0.35, -0.3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Planet dot on ring
    const angle = i * 1.8 + 0.5;
    const px = pos.x + orbitR * Math.cos(angle);
    const py = pos.y + orbitR * 0.35 * Math.sin(angle - 0.3);
    const dotR = Math.max(0.8, planetSizes[i]);
    ctx.beginPath();
    ctx.arc(px, py, dotR, 0, Math.PI * 2);
    ctx.fillStyle = planetColors[i];
    ctx.fill();
  }

  // Sun glow
  const gradient = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, r * 0.8);
  gradient.addColorStop(0, 'rgba(253, 184, 19, 0.5)');
  gradient.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, r * 0.8, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();

  // Sun dot
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, Math.max(1.5, r * 0.18), 0, Math.PI * 2);
  ctx.fillStyle = '#FDB813';
  ctx.fill();

  // Label
  if (r > 8) {
    const labelR = r * 2.5;
    ctx.font = `400 ${Math.max(14, Math.min(16, r * 0.4))}px 'Segoe UI', system-ui, sans-serif`;
    ctx.fillStyle = `rgba(255,255,255,${0.55 * ssIconAlpha})`;
    ctx.textAlign = 'left';
    ctx.fillText('Solar System', pos.x + labelR + 8, pos.y + 4);
  }

  ctx.restore();
}

// =============================================================
// DRAW: LAYER 3 — GALACTIC LANDMARKS
// Dots + glows + labels for Proxima through MW Center.
// =============================================================
function drawGalacticLandmarks(time) {
  if (landmarkAlpha <= 0) return;

  ctx.save();
  ctx.globalAlpha = landmarkAlpha;

  for (const obj of galacticLandmarks) {
    const pos = toScreen(obj.xOff, obj.y);
    if (pos.x < -100 || pos.x > cssWidth + 100 || pos.y < -100 || pos.y > cssHeight + 100) continue;

    const zoomFactor = camZoom / 10;
    const drawR = Math.max(2, Math.min(obj.baseR * Math.sqrt(zoomFactor), 20));

    const isDest = obj.name === currentDest;

    // Arrival arrow
    if (isDest && arrivalAmount > 0) {
      const arrowX = pos.x - drawR - 14;
      const size = 5;
      ctx.fillStyle = `rgba(126, 184, 255, ${arrivalAmount * 0.9})`;
      ctx.beginPath();
      ctx.moveTo(arrowX + size, pos.y);
      ctx.lineTo(arrowX - size, pos.y - size);
      ctx.lineTo(arrowX - size, pos.y + size);
      ctx.closePath();
      ctx.fill();
    }

    // Glow
    if (obj.glow && drawR > 2.5) {
      const gradient = ctx.createRadialGradient(pos.x, pos.y, drawR, pos.x, pos.y, drawR * 3);
      gradient.addColorStop(0, obj.glow);
      gradient.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, drawR * 3, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    // Body
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, drawR, 0, Math.PI * 2);
    ctx.fillStyle = obj.color;
    ctx.fill();

    // Label
    if (drawR > 1.5 || isDest) {
      const arrived = isDest && arrivalAmount > 0;
      const fontSize = arrived ? 18 : Math.max(14, Math.min(16, drawR * 1.3));
      ctx.font = `${arrived ? '600' : '400'} ${fontSize}px 'Segoe UI', system-ui, sans-serif`;
      ctx.fillStyle = arrived ? `rgba(126, 184, 255, ${0.5 + arrivalAmount * 0.5})` :
                      isDest ? 'rgba(126, 184, 255, 0.9)' : 'rgba(255,255,255,0.55)';
      if (obj.xOff >= 0) {
        ctx.textAlign = 'left';
        ctx.fillText(obj.name, pos.x + drawR + 8, pos.y + 4);
      } else {
        ctx.textAlign = 'right';
        ctx.fillText(obj.name, pos.x - drawR - 8, pos.y + 4);
      }
    }
  }
  ctx.restore();
}

// =============================================================
// DRAW: LAYER 4 — MILKY WAY SPIRAL
// Procedural spiral arm stars + core glow.
// =============================================================
function drawMilkyWay(time) {
  if (mwSpiralAlpha <= 0) return;

  ctx.save();
  ctx.globalAlpha = mwSpiralAlpha;

  // Core glow
  const corePos = toScreen(MW_CENTER_X, MW_CENTER_Y);
  const coreR = 5 * camZoom;
  if (coreR > 2 && coreR < cssWidth * 2) {
    const drawR = Math.min(coreR, 150);
    const gradient = ctx.createRadialGradient(corePos.x, corePos.y, 0, corePos.x, corePos.y, drawR);
    gradient.addColorStop(0, `rgba(255, 240, 200, ${mwSpiralAlpha * 0.4})`);
    gradient.addColorStop(0.3, `rgba(255, 220, 150, ${mwSpiralAlpha * 0.15})`);
    gradient.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(corePos.x, corePos.y, drawR, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
  }

  // Spiral arm stars
  for (const star of spiralStars) {
    const pos = toScreen(star.x, star.y);
    if (pos.x < -5 || pos.x > cssWidth + 5 || pos.y < -5 || pos.y > cssHeight + 5) continue;
    const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
    const alpha = mwSpiralAlpha * star.brightness * (0.3 + 0.7 * twinkle);
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, star.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(230, 220, 200, ${alpha})`;
    ctx.fill();
  }

  // Label
  if (mwSpiralAlpha > 0.5) {
    const labelPos = toScreen(MW_CENTER_X + 25, MW_CENTER_Y);
    if (labelPos.y > 0 && labelPos.y < cssHeight) {
      ctx.font = '14px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = `rgba(255,255,255,${mwSpiralAlpha * 0.5})`;
      ctx.textAlign = 'left';
      ctx.fillText('Milky Way', labelPos.x, labelPos.y);
    }
  }

  ctx.restore();
}

// =============================================================
// DRAW: LAYER 5 — ANDROMEDA GALAXY
// Procedural spiral + core glow + arrival highlight.
// Only visible for the Andromeda destination.
// =============================================================
function drawAndromeda(time) {
  if (andromedaAlpha <= 0) return;

  ctx.save();
  ctx.globalAlpha = andromedaAlpha;

  // Core glow
  const corePos = toScreen(ANDROMEDA_X, ANDROMEDA_Y);
  const coreR = 2 * camZoom;

  // Arrival arrow
  if (arrivalAmount > 0) {
    const arrowX = corePos.x - 20;
    const size = 5;
    ctx.fillStyle = `rgba(126, 184, 255, ${arrivalAmount * 0.9})`;
    ctx.beginPath();
    ctx.moveTo(arrowX + size, corePos.y);
    ctx.lineTo(arrowX - size, corePos.y - size);
    ctx.lineTo(arrowX - size, corePos.y + size);
    ctx.closePath();
    ctx.fill();
  }

  if (coreR > 1 && coreR < cssWidth) {
    const drawR = Math.min(coreR, 100);
    const gradient = ctx.createRadialGradient(corePos.x, corePos.y, 0, corePos.x, corePos.y, drawR);
    gradient.addColorStop(0, `rgba(200, 210, 255, ${andromedaAlpha * 0.35})`);
    gradient.addColorStop(0.4, `rgba(180, 190, 230, ${andromedaAlpha * 0.1})`);
    gradient.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(corePos.x, corePos.y, drawR, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
  }

  // Spiral stars
  for (const star of andromedaStars) {
    const pos = toScreen(star.x, star.y);
    if (pos.x < -5 || pos.x > cssWidth + 5 || pos.y < -5 || pos.y > cssHeight + 5) continue;
    const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
    const alpha = andromedaAlpha * star.brightness * (0.3 + 0.7 * twinkle);
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, star.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 210, 255, ${alpha})`;
    ctx.fill();
  }

  // Label
  if (andromedaAlpha > 0.3) {
    const labelPos = toScreen(ANDROMEDA_X, ANDROMEDA_Y - 3);
    if (labelPos.y > 0 && labelPos.y < cssHeight) {
      const arrived = arrivalAmount > 0;
      const fontSize = arrived ? 18 : 14;
      ctx.font = `${arrived ? '600' : '400'} ${fontSize}px "Segoe UI", system-ui, sans-serif`;
      ctx.fillStyle = arrived ? `rgba(126, 184, 255, ${0.5 + arrivalAmount * 0.5})` :
                      `rgba(255,255,255,${andromedaAlpha * 0.5})`;
      ctx.textAlign = 'center';
      ctx.fillText('Andromeda Galaxy', labelPos.x, labelPos.y);
    }
  }

  ctx.restore();
}

// =============================================================
// SHIP TRAIL
// Dashed line from Earth toward destination. [6,6] dash, 0.4 opacity, 1.5px.
// UP for outward trips, DOWN for Sun/Mercury.
// Ship dot hidden at 98%. Ship clamped to top of viewport.
// =============================================================
function drawTrail(progress) {
  const dest = DESTINATIONS[currentDest];
  const earthY = auToY(EARTH_AU);
  const destY = destToY(dest);

  const earthScreen = toScreen(0, earthY);

  // Destination screen position — use xOff for galactic landmarks
  let destScreenX = 0;
  if (dest.category === 'milkyway') {
    const landmark = galacticLandmarks.find(o => o.name === currentDest);
    if (landmark) destScreenX = landmark.xOff;
  } else if (currentDest === 'Andromeda Galaxy') {
    destScreenX = ANDROMEDA_X;
  }
  const destScreen = toScreen(destScreenX, destY);

  const e = easeInCubicOut(progress);
  const trailEnd = {
    x: earthScreen.x + (destScreen.x - earthScreen.x) * e,
    y: earthScreen.y + (destScreen.y - earthScreen.y) * e,
  };
  // Keep ship visible — clamp to top of viewport
  trailEnd.y = Math.max(60, trailEnd.y);

  if (progress > 0) {
    ctx.save();
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = 'rgba(126, 184, 255, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(earthScreen.x, earthScreen.y);
    ctx.lineTo(trailEnd.x, trailEnd.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Ship dot + glow (hidden at 98%)
    if (progress < 0.98) {
      ctx.beginPath();
      ctx.arc(trailEnd.x, trailEnd.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#7eb8ff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(trailEnd.x, trailEnd.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(126, 184, 255, 0.15)';
      ctx.fill();
    }
    ctx.restore();
  }
}

// =============================================================
// MAIN ANIMATION LOOP
// Draw order (back to front):
// 1. Background fill
// 2. Stars (parallax)
// 3. MW spiral (Layer 4)
// 4. Andromeda (Layer 5)
// 5. Ship trail
// 6. Galactic landmarks (Layer 3)
// 7. Solar System icon (Layer 2)
// 8. Planets (Layer 1) — on top so they're crisp when close
//
// Trip data panel fades in at 88% progress.
// Arrival highlight ramps 0.75 → 0.90.
// =============================================================
let startTime = null;
let animId = null;

function frame(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;
  const progress = Math.min(1, elapsed / animDuration);
  const time = timestamp / 1000;

  const cam = getCameraState(progress);
  camX = cam.cx;
  camY = cam.cy;
  camZoom = cam.zoom;

  // Compute LOD alphas based on current zoom
  computeLODAlphas(camZoom, progress);

  // Arrival ramps in from progress 0.75 to 0.90
  arrivalAmount = Math.min(1, Math.max(0, (progress - 0.75) / 0.15));

  // Clear
  ctx.fillStyle = '#030308';
  ctx.fillRect(0, 0, cssWidth, cssHeight);

  // Draw layers back-to-front
  drawStars(time);
  drawMilkyWay(time);
  drawAndromeda(time);
  drawTrail(progress);
  drawGalacticLandmarks(time);
  drawSolarSystemIcon();
  drawPlanets(time);

  // Trip data panel fade-in at 88%
  if (progress > 0.88) {
    document.getElementById('trip-data').classList.add('visible');
  }

  if (progress < 1) {
    animId = requestAnimationFrame(frame);
  }
}

// =============================================================
// LAUNCH — starts/restarts animation for a given destination
// =============================================================
function launchTo(destName) {
  currentDest = destName;
  const dest = DESTINATIONS[destName];

  document.getElementById('trip-heading').textContent = `Earth → ${destName}`;
  document.getElementById('stat-dist').textContent = dest.distLabel;
  document.title = `Earth → ${destName}`;

  computeAnimParams(destName);

  if (animId) cancelAnimationFrame(animId);
  startTime = null;
  document.getElementById('trip-data').classList.remove('visible');
  arrivalAmount = 0;
  animId = requestAnimationFrame(frame);
}

// =============================================================
// DROPDOWN — all 15 destinations
// =============================================================
const select = document.getElementById('dest-select');
for (const name of Object.keys(DESTINATIONS)) {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name;
  if (name === currentDest) opt.selected = true;
  select.appendChild(opt);
}

launchTo(currentDest);
</script>
