<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unified Movie Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; height: 100dvh; touch-action: none; }
  canvas { display: block; will-change: transform; }
  #controls {
    position: fixed; top: 20px; right: 20px; z-index: 20;
    display: flex; gap: 8px; align-items: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #dest-select {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 8px 12px; border-radius: 6px;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
  }
  #dest-select option { background: #1a1a2e; color: #fff; }
  #dest-select optgroup { background: #1a1a2e; color: #aaa; font-style: normal; }
  #go-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
  }
  #go-btn:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
  <select id="dest-select"></select>
  <button id="go-btn" onclick="launchTo(document.getElementById('dest-select').value)">Go</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// =============================================================
// 1. CONFIG — all tunable magic numbers in one place
// =============================================================
const CONFIG = {
  DURATION_SOLAR:       6000,   // ms — solar system animation length
  DURATION_MILKYWAY:    6000,   // ms — milky way animation length
  DURATION_EXTRAGALACTIC: 7000, // ms — extragalactic animation length (more ground to cover)

  TOP_MARGIN:    40,   // px — breathing room at top of viewport
  BOTTOM_MARGIN: 120,  // px — breathing room below source (Earth/Sun) at bottom of viewport

  ARRIVAL_START: 0.75, // progress when arrival highlight begins fading in
  ARRIVAL_END:   0.90, // progress when arrival highlight is fully visible

  TRAIL_HIDE_SHIP: 0.98, // progress when ship dot hides (near destination)
};

// Per-category overrides
const CATEGORY_CONFIG = {
  'Solar System': {
    startZoomFactor: 600,    // absolute px/AU — tight on Earth
    delayPan: false,         // linear pan with easing
  },
  'Milky Way': {
    startZoomFactor: 12,     // multiplied by screenH — tight on Solar System
    delayPan: false,
  },
  'Extragalactic': {
    startZoomFactor: 12,     // multiplied by screenH — tight on Earth
    delayPan: true,          // e*e pan so MW spiral stays in frame during zoom-out
  },
};

// =============================================================
// 2. DESTINATION CATALOG — all 15 destinations, one flat list
// =============================================================
// Each destination has:
//   name: display name
//   category: which renderer to use
//   raw: raw distance value (AU for solar, ly for milky way, unused for extragalactic)
//   distLabel: formatted distance string
const DESTINATIONS = [
  // --- Solar System (AU distances) ---
  { name: 'The Sun',    category: 'Solar System', raw: 0,     distLabel: '93M mi' },
  { name: 'Mercury',    category: 'Solar System', raw: 0.39,  distLabel: '56M mi' },
  { name: 'The Moon',   category: 'Solar System', raw: 1.15,  distLabel: '239K mi' },
  { name: 'Mars',       category: 'Solar System', raw: 1.52,  distLabel: '140M mi' },
  { name: 'Jupiter',    category: 'Solar System', raw: 5.2,   distLabel: '484M mi' },
  { name: 'Saturn',     category: 'Solar System', raw: 9.5,   distLabel: '886M mi' },
  { name: 'Pluto',      category: 'Solar System', raw: 39.5,  distLabel: '3.7B mi' },

  // --- Milky Way (light-year distances) ---
  { name: 'Proxima Centauri',    category: 'Milky Way', raw: 4.24,  distLabel: '4.24 ly' },
  { name: 'Polaris',             category: 'Milky Way', raw: 433,   distLabel: '433 ly' },
  { name: 'Betelgeuse',          category: 'Milky Way', raw: 700,   distLabel: '700 ly' },
  { name: 'Horsehead Nebula',    category: 'Milky Way', raw: 1500,  distLabel: '1,500 ly' },
  { name: 'Crab Nebula',         category: 'Milky Way', raw: 6500,  distLabel: '6,500 ly' },
  { name: 'Pillars of Creation', category: 'Milky Way', raw: 6500,  distLabel: '6,500 ly' },
  { name: 'Milky Way Center',    category: 'Milky Way', raw: 26000, distLabel: '26,000 ly' },

  // --- Extragalactic ---
  { name: 'Andromeda Galaxy',  category: 'Extragalactic', raw: 2537000,  distLabel: '2.5M ly' },
  { name: 'Triangulum Galaxy', category: 'Extragalactic', raw: 2730000,  distLabel: '2.7M ly' },
  { name: 'Whirlpool Galaxy',  category: 'Extragalactic', raw: 23000000, distLabel: '23M ly' },
  { name: 'Sombrero Galaxy',   category: 'Extragalactic', raw: 29000000, distLabel: '29M ly' },
];

// =============================================================
// 3. COORDINATE MAPPING — raw distance to normalized Y [0, 1]
// =============================================================

// Solar System: linear scale, Earth at 1.0 AU
// sourceY = 1.0 (Earth's AU position)
// destY = planet's AU position
// No normalization needed — we use AU directly as world coords

// Milky Way: log scale
const MW_LOG_MIN = Math.log10(1);       // 1 ly
const MW_LOG_MAX = Math.log10(30000);   // just above MW center
function lyToY(ly) {
  if (ly <= 0) return 0;
  return (Math.log10(ly) - MW_LOG_MIN) / (MW_LOG_MAX - MW_LOG_MIN);
}

// Extragalactic: log-scale positioning for multiple galaxies
const EXTRA_EARTH_Y = 0.2;                          // Earth/Solar System position
const EXTRA_LOG_MIN = Math.log10(1000000);           // 1M ly
const EXTRA_LOG_MAX = Math.log10(50000000);          // 50M ly
function extraLyToY(ly) {
  // Maps galaxy distances to Y positions above EXTRA_EARTH_Y
  return EXTRA_EARTH_Y + 0.05 + (Math.log10(ly) - EXTRA_LOG_MIN) / (EXTRA_LOG_MAX - EXTRA_LOG_MIN) * 0.7;
}

// Get the Y coordinate for a destination in world space
function getDestY(dest) {
  switch (dest.category) {
    case 'Solar System':    return dest.raw;              // AU directly
    case 'Milky Way':       return lyToY(dest.raw);       // normalized log
    case 'Extragalactic':   return extraLyToY(dest.raw);  // log-scaled galaxy position
  }
}

// Get the Y coordinate for the source (Earth) in world space
function getSourceY(category) {
  switch (category) {
    case 'Solar System':    return 1.0;          // Earth at 1.0 AU
    case 'Milky Way':       return 0;            // Solar System at bottom
    case 'Extragalactic':   return EXTRA_EARTH_Y; // fixed 0.2
  }
}

// =============================================================
// 4. CATEGORY RENDERING DATA
// =============================================================

// --- Solar System: planets along the AU axis ---
const solarPlanets = [
  { name: 'Sun',     au: 0,     baseR: 22, color: '#FDB813', glow: '#FDB81350', ring: false },
  { name: 'Mercury', au: 0.39,  baseR: 2,  color: '#8c7e6d', glow: null, ring: false },
  { name: 'Venus',   au: 0.72,  baseR: 4.8,color: '#c9a860', glow: null, ring: false },
  { name: 'Earth',   au: 1.0,   baseR: 5,  color: '#4a90d9', glow: '#4a90d940', ring: false },
  { name: 'Moon',    au: 1.15,  baseR: 1.2,color: '#aaa9a5', glow: null, ring: false },
  { name: 'Mars',    au: 1.52,  baseR: 3,  color: '#c1440e', glow: null, ring: false },
  { name: 'Jupiter', au: 5.2,   baseR: 14, color: '#c88b3a', glow: '#c88b3a20', ring: false },
  { name: 'Saturn',  au: 9.5,   baseR: 12, color: '#d4a94b', glow: '#d4a94b30', ring: true },
  { name: 'Uranus',  au: 19.2,  baseR: 6,  color: '#7ec8c8', glow: '#7ec8c820', ring: false },
  { name: 'Neptune', au: 30.1,  baseR: 5.8,color: '#3f54ba', glow: '#3f54ba20', ring: false },
  { name: 'Pluto',   au: 39.5,  baseR: 1.2,color: '#c4b59a', glow: null, ring: false },
];

// --- Milky Way: galactic objects with log-scaled Y positions ---
const galacticObjects = [
  { name: 'Solar System',        ly: 0,     baseR: 5,  color: '#4a90d9', glow: '#4a90d940', x: 0 },
  { name: 'Proxima Centauri',    ly: 4.24,  baseR: 4,  color: '#ff6b4a', glow: '#ff6b4a30', x: 0.01 },
  { name: 'Polaris',             ly: 433,   baseR: 5,  color: '#fffbe0', glow: '#fffbe040', x: -0.01 },
  { name: 'Betelgeuse',          ly: 700,   baseR: 7,  color: '#ff4500', glow: '#ff450040', x: 0.015 },
  { name: 'Horsehead Nebula',    ly: 1500,  baseR: 6,  color: '#8b4585', glow: '#8b458540', x: -0.015 },
  { name: 'Crab Nebula',         ly: 6500,  baseR: 6,  color: '#4ecdc4', glow: '#4ecdc430', x: 0.01 },
  { name: 'Pillars of Creation', ly: 6500,  baseR: 6,  color: '#c79a3e', glow: '#c79a3e30', x: -0.01 },
  { name: 'Milky Way Center',    ly: 26000, baseR: 8,  color: '#ffd700', glow: '#ffd70050', x: 0 },
];
// Precompute Y positions
for (const obj of galacticObjects) {
  obj.y = lyToY(obj.ly);
}
// Nudge Pillars apart from Crab (same ly)
galacticObjects.find(o => o.name === 'Pillars of Creation').y += 0.02;

// --- Extragalactic: Milky Way spiral + Andromeda spiral ---
const extraMilkyWayPos = { x: 0, y: EXTRA_EARTH_Y + 0.02 };
// (Andromeda position now computed dynamically in extraGalaxies array)

// Milky Way spiral stars
const spiralStars = [];
const MW_ARM_COUNT = 4;
const MW_STARS_PER_ARM = 300;
for (let arm = 0; arm < MW_ARM_COUNT; arm++) {
  const armOffset = (arm / MW_ARM_COUNT) * Math.PI * 2;
  for (let i = 0; i < MW_STARS_PER_ARM; i++) {
    const t = i / MW_STARS_PER_ARM;
    const angle = armOffset + t * Math.PI * 2.5;
    const radius = 0.005 + t * 0.1;
    const spread = 0.004 + t * 0.012;
    const r = radius + (Math.random() - 0.5) * spread;
    const a = angle + (Math.random() - 0.5) * 0.4;
    spiralStars.push({
      x: extraMilkyWayPos.x + r * Math.cos(a),
      y: extraMilkyWayPos.y + r * Math.sin(a) * 0.4,
      brightness: 0.3 + Math.random() * 0.7,
      size: 0.3 + Math.random() * 1.2,
      twinkleSpeed: 0.3 + Math.random() * 1,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
}
const extraCoreGlow = { x: extraMilkyWayPos.x, y: extraMilkyWayPos.y, radius: 0.025 };

// Milky Way reference landmarks — shown briefly during extragalactic zoom-out
// to give a sense of scale before they vanish into the spiral
// Positioned using log scale within the MW spiral's visual extent
const MW_LANDMARK_SPAN = 0.06; // how much Y-space the landmarks spread across
const extraMilkyWayLandmarks = [
  { name: 'Proxima Centauri',  ly: 4.24,  distLabel: '4.24 ly',   color: '#ff6b4a', x:  0.015 },
  { name: 'Polaris',           ly: 433,   distLabel: '433 ly',     color: '#fffbe0', x: -0.015 },
  { name: 'Betelgeuse',        ly: 700,   distLabel: '700 ly',     color: '#ff4500', x:  0.02 },
  { name: 'Crab Nebula',       ly: 6500,  distLabel: '6,500 ly',   color: '#4ecdc4', x: -0.02 },
  { name: 'MW Center',         ly: 26000, distLabel: '26,000 ly',  color: '#ffd700', x:  0.015 },
];
// Map into extragalactic coordinate space using log positioning
for (const lm of extraMilkyWayLandmarks) {
  lm.y = EXTRA_EARTH_Y + lyToY(lm.ly) * MW_LANDMARK_SPAN;
}

// --- Extragalactic galaxies — data-driven with generated spiral stars ---
// Each galaxy: position, visual properties, generated stars
function generateSpiralStars(center, arms, starsPerArm, maxRadius, tilt, turns) {
  const stars = [];
  for (let arm = 0; arm < arms; arm++) {
    const armOffset = (arm / arms) * Math.PI * 2;
    for (let i = 0; i < starsPerArm; i++) {
      const t = i / starsPerArm;
      const angle = armOffset + t * Math.PI * turns;
      const radius = maxRadius * 0.06 + t * maxRadius;
      const spread = maxRadius * (0.06 + t * 0.15);
      const r = radius + (Math.random() - 0.5) * spread;
      const a = angle + (Math.random() - 0.5) * 0.5;
      stars.push({
        x: center.x + r * Math.cos(a),
        y: center.y + r * Math.sin(a) * tilt,
        brightness: 0.2 + Math.random() * 0.6,
        size: 0.3 + Math.random() * 0.8,
        twinkleSpeed: 0.3 + Math.random() * 1,
        twinkleOffset: Math.random() * Math.PI * 2,
      });
    }
  }
  return stars;
}

// Generate edge-on disc stars (for Sombrero)
function generateDiscStars(center, count, width, height) {
  const stars = [];
  for (let i = 0; i < count; i++) {
    // Gaussian-ish distribution: denser toward center
    const angle = Math.random() * Math.PI * 2;
    const rNorm = Math.random() * Math.random(); // clusters toward center
    const r = rNorm * width;
    stars.push({
      x: center.x + r * Math.cos(angle),
      y: center.y + r * Math.sin(angle) * height / width,
      brightness: 0.2 + Math.random() * 0.6 * (1 - rNorm * 0.5),
      size: 0.3 + Math.random() * 0.8,
      twinkleSpeed: 0.3 + Math.random() * 1,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
  return stars;
}

const extraGalaxies = [
  {
    name: 'Andromeda Galaxy',
    distLy: 2537000,
    x: 0.03,
    starColor: '200, 210, 255',        // cool blue
    coreColor: '200, 210, 255',
    coreRadius: 0.01,
    arms: 3, starsPerArm: 150, maxRadius: 0.03, tilt: 0.5, turns: 2,
  },
  {
    name: 'Triangulum Galaxy',
    distLy: 2730000,
    x: -0.04,
    starColor: '190, 210, 240',         // softer blue
    coreColor: '190, 210, 240',
    coreRadius: 0.006,
    arms: 3, starsPerArm: 80, maxRadius: 0.02, tilt: 0.45, turns: 1.8,
  },
  {
    name: 'Whirlpool Galaxy',
    distLy: 23000000,
    x: 0.02,
    starColor: '220, 180, 230',         // pinkish (famous HII regions)
    coreColor: '230, 210, 240',
    coreRadius: 0.008,
    arms: 2, starsPerArm: 130, maxRadius: 0.025, tilt: 0.55, turns: 2.5,
  },
  {
    name: 'Sombrero Galaxy',
    distLy: 29000000,
    x: -0.03,
    starColor: '240, 220, 180',         // warm gold
    coreColor: '255, 240, 200',
    coreRadius: 0.012,                   // prominent bright core
    edgeOn: true,                        // disc, not spiral
    discStars: 200, discWidth: 0.03, discHeight: 0.004,
  },
];

// Compute Y positions and generate stars for each galaxy
for (const g of extraGalaxies) {
  g.y = extraLyToY(g.distLy);
  if (g.edgeOn) {
    g.stars = generateDiscStars({ x: g.x, y: g.y }, g.discStars, g.discWidth, g.discHeight);
  } else {
    g.stars = generateSpiralStars({ x: g.x, y: g.y }, g.arms, g.starsPerArm, g.maxRadius, g.tilt, g.turns);
  }
}

// =============================================================
// 5. BACKGROUND STARS — shared across all categories
// =============================================================
// Built per-category because spread and centering differ
const bgStarSets = {};

function buildStarLayers(category) {
  const layers = [];
  if (category === 'Solar System') {
    // AU-scale stars, centered around solar system
    for (let layer = 0; layer < 3; layer++) {
      const stars = [];
      const count = 300 + layer * 200;
      for (let i = 0; i < count; i++) {
        stars.push({
          x: (Math.random() - 0.5) * 120,
          y: (Math.random() - 0.5) * 120,
          brightness: 0.2 + Math.random() * 0.8,
          size: 0.5 + Math.random() * (1.5 - layer * 0.3),
          twinkleSpeed: 1 + Math.random() * 3,
          twinkleOffset: Math.random() * Math.PI * 2,
        });
      }
      layers.push({ stars, parallax: 0.3 + layer * 0.35 });
    }
  } else {
    // Normalized-scale stars for Milky Way and Extragalactic
    const centerY = category === 'Extragalactic' ? 0.45 : 0.5;
    const defs = [
      { count: 500, spread: 10, parallax: 0.1 },
      { count: 350, spread: 6,  parallax: 0.2 },
      { count: 200, spread: 3,  parallax: 0.4 },
    ];
    for (const def of defs) {
      const stars = [];
      for (let i = 0; i < def.count; i++) {
        stars.push({
          x: (Math.random() - 0.5) * def.spread,
          y: (Math.random() - 0.5) * def.spread + centerY,
          brightness: 0.2 + Math.random() * 0.8,
          size: 0.5 + Math.random() * 1.2,
          twinkleSpeed: 1 + Math.random() * 3,
          twinkleOffset: Math.random() * Math.PI * 2,
        });
      }
      layers.push({ stars, parallax: def.parallax });
    }
  }
  return layers;
}

// Pre-build star layers for each category
bgStarSets['Solar System'] = buildStarLayers('Solar System');
bgStarSets['Milky Way'] = buildStarLayers('Milky Way');
bgStarSets['Extragalactic'] = buildStarLayers('Extragalactic');

// =============================================================
// 6. SHARED ENGINE — canvas, camera, coordinate conversion
// =============================================================
let camX, camY, camZoom;
let cssWidth, cssHeight;

function toScreen(worldX, worldY, parallax = 1.0) {
  const dx = (worldX - camX) * parallax;
  const dy = (worldY - camY) * parallax;
  return {
    x: cssWidth / 2 + dx * camZoom,
    y: cssHeight / 2 - dy * camZoom,
  };
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cssWidth = window.innerWidth;
  cssHeight = window.innerHeight;
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  canvas.style.width = cssWidth + 'px';
  canvas.style.height = cssHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Easing: slow cubic start (85%), gentle quadratic landing (15%)
function easeInCubicOut(t) {
  if (t < 0.85) {
    const st = t / 0.85;
    return 0.85 * (st * st * st);
  }
  const st = (t - 0.85) / 0.15;
  return 0.85 + 0.15 * (1 - Math.pow(1 - st, 2));
}

// =============================================================
// 7. FRAMING — single computeFraming() for all categories
// =============================================================
// Returns { hold, final, logZoomStart, logZoomEnd }
let hold, finalState, logZoomStart, logZoomEnd;

function computeFraming(dest) {
  const category = dest.category;
  const catCfg = CATEGORY_CONFIG[category];
  const screenH = cssHeight || 800;
  const sourceY = getSourceY(category);
  const destY = getDestY(dest);

  let startZoom, finalZoom, holdCY, finalCY;

  if (category === 'Solar System') {
    // AU coordinate space — zoom is px/AU
    startZoom = catCfg.startZoomFactor; // 600 px/AU

    const minAU = 0;
    const maxAU = Math.max(destY, 1.5); // at least show past Earth
    const usableH = screenH - CONFIG.TOP_MARGIN - CONFIG.BOTTOM_MARGIN;
    finalZoom = Math.max(2, Math.min(200, usableH / Math.max(maxAU - minAU, 0.5)));

    holdCY = sourceY; // start centered on Earth (1.0 AU)
    // Offset so Sun (0 AU) sits just above the bottom panel
    finalCY = (screenH / 2 - CONFIG.BOTTOM_MARGIN) / finalZoom;

  } else if (category === 'Milky Way') {
    // Normalized [0, 1] — zoom is px/unit
    startZoom = screenH * catCfg.startZoomFactor; // screenH * 12

    finalZoom = Math.max(screenH * 0.4, (screenH * 0.55) / Math.max(destY, 0.15));

    holdCY = sourceY; // 0 (Solar System at bottom)
    finalCY = destY / 2; // midpoint between source and dest

  } else {
    // Extragalactic — normalized, log-scaled galaxy positions
    startZoom = screenH * catCfg.startZoomFactor; // screenH * 12

    const span = destY - EXTRA_EARTH_Y;
    const usableH = screenH - CONFIG.TOP_MARGIN - CONFIG.BOTTOM_MARGIN;
    finalZoom = usableH / Math.max(span, 0.15);

    holdCY = EXTRA_EARTH_Y;
    finalCY = EXTRA_EARTH_Y + span * 0.5; // centered between source and dest
  }

  hold = { cx: 0, cy: holdCY, zoom: startZoom };
  finalState = {
    cx: 0,
    cy: finalCY,
    zoom: finalZoom,
  };
  logZoomStart = Math.log(hold.zoom);
  logZoomEnd = Math.log(finalState.zoom);
}

// =============================================================
// 8. CAMERA — single getCameraState()
// =============================================================
let currentDest = null;

function getCameraState(progress) {
  const e = easeInCubicOut(progress);
  const logZoom = logZoomStart + (logZoomEnd - logZoomStart) * e;
  const zoom = Math.exp(logZoom);

  const sourceY = getSourceY(currentDest.category);
  const catCfg = CATEGORY_CONFIG[currentDest.category];

  // Pan easing — extragalactic uses e*e to delay vertical pan
  const panE = catCfg.delayPan ? e * e : e;

  // Clamp pan so source never drops below the viewport
  const maxCY = sourceY + (cssHeight / 2 - CONFIG.BOTTOM_MARGIN) / zoom;
  const cy = Math.min(hold.cy + (finalState.cy - hold.cy) * panE, maxCY);

  return {
    cx: hold.cx + (finalState.cx - hold.cx) * e,
    cy: cy,
    zoom: zoom,
  };
}

// =============================================================
// 9. SHARED DRAW FUNCTIONS
// =============================================================
let arrivalAmount = 0;

function drawStars(time) {
  const layers = bgStarSets[currentDest.category];
  for (const layer of layers) {
    for (const star of layer.stars) {
      const pos = toScreen(star.x, star.y, layer.parallax);
      if (pos.x < -10 || pos.x > cssWidth + 10 || pos.y < -10 || pos.y > cssHeight + 10) continue;
      const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
      const alpha = star.brightness * (0.3 + 0.7 * twinkle);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, star.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();
    }
  }
}

function drawTrail(progress) {
  const sourceY = getSourceY(currentDest.category);
  const destY = getDestY(currentDest);

  // Source X is always 0; dest X varies by category
  let destX = 0;
  if (currentDest.category === 'Milky Way') {
    const obj = galacticObjects.find(o => o.name === currentDest.name);
    if (obj) destX = obj.x;
  } else if (currentDest.category === 'Extragalactic') {
    const gal = extraGalaxies.find(g => g.name === currentDest.name);
    if (gal) destX = gal.x;
  }

  const earthScreen = toScreen(0, sourceY);
  const destScreen = toScreen(destX, destY);

  const e = easeInCubicOut(progress);
  const trailEnd = {
    x: earthScreen.x + (destScreen.x - earthScreen.x) * e,
    y: earthScreen.y + (destScreen.y - earthScreen.y) * e,
  };
  // Clamp ship to top of viewport
  trailEnd.y = Math.max(60, trailEnd.y);

  if (progress > 0) {
    ctx.save();
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = 'rgba(126, 184, 255, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(earthScreen.x, earthScreen.y);
    ctx.lineTo(trailEnd.x, trailEnd.y);
    ctx.stroke();
    ctx.setLineDash([]);

    if (progress < CONFIG.TRAIL_HIDE_SHIP) {
      ctx.beginPath();
      ctx.arc(trailEnd.x, trailEnd.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#7eb8ff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(trailEnd.x, trailEnd.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(126, 184, 255, 0.12)';
      ctx.fill();
    }
    ctx.restore();
  }
}

// Arrival arrow — triangle pointing right at a screen position
function drawArrivalArrow(screenX, screenY, offsetX) {
  if (arrivalAmount <= 0) return;
  const arrowX = screenX - offsetX;
  const arrowY = screenY;
  const size = 5;
  const alpha = arrivalAmount * 0.9;
  ctx.save();
  ctx.fillStyle = `rgba(126, 184, 255, ${alpha})`;
  ctx.beginPath();
  ctx.moveTo(arrowX + size, arrowY);
  ctx.lineTo(arrowX - size, arrowY - size);
  ctx.lineTo(arrowX - size, arrowY + size);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Solar System icon — tiny sun + 4 orbit rings (used by Milky Way and Extragalactic)
function drawSolarSystemIcon(pos) {
  const r = Math.max(3, Math.min(60, camZoom * 0.008));
  const orbits = [0.35, 0.55, 0.75, 1.0];
  const planetColors = ['#c1440e', '#c88b3a', '#d4a94b', '#3f54ba'];
  const planetSizes = [0.8, 1.4, 1.2, 0.9];

  ctx.save();
  for (let i = 0; i < orbits.length; i++) {
    const orbitR = r * orbits[i] * 2.5;
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y, orbitR, orbitR * 0.35, -0.3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    const angle = i * 1.8 + 0.5;
    const px = pos.x + orbitR * Math.cos(angle);
    const py = pos.y + orbitR * 0.35 * Math.sin(angle - 0.3);
    const dotR = Math.max(0.8, planetSizes[i]);
    ctx.beginPath();
    ctx.arc(px, py, dotR, 0, Math.PI * 2);
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = planetColors[i];
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Sun glow
  const gradient = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, r * 0.8);
  gradient.addColorStop(0, 'rgba(253, 184, 19, 0.5)');
  gradient.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, r * 0.8, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();

  // Sun dot
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, Math.max(1.5, r * 0.18), 0, Math.PI * 2);
  ctx.fillStyle = '#FDB813';
  ctx.fill();
  ctx.restore();

  return r; // return radius for label offset
}

// =============================================================
// 10. CATEGORY DRAW FUNCTIONS
// =============================================================

// --- Solar System ---
function drawSolarSystemObjects(time) {
  // Orbit hints
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (const p of solarPlanets) {
    if (p.au === 0) continue;
    const center = toScreen(0, 0);
    const r = p.au * camZoom;
    if (r > 5 && r < cssHeight * 3) {
      ctx.beginPath();
      ctx.arc(center.x, center.y, r, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();

  // Planets
  for (const planet of solarPlanets) {
    const pos = toScreen(0, planet.au);
    const r = planet.baseR * (camZoom / 60);
    const minR = planet.name === 'Sun' ? 4 : 1.5;
    const drawR = Math.max(minR, Math.min(r, planet.name === 'Sun' ? 60 : 30));

    if (pos.x < -100 || pos.x > cssWidth + 100 || pos.y < -100 || pos.y > cssHeight + 100) continue;

    // Is this the destination?
    const isDestPlanet = planet.name === currentDest.name ||
      (currentDest.name === 'The Moon' && planet.name === 'Moon') ||
      (currentDest.name === 'The Sun' && planet.name === 'Sun');

    // Arrival arrow
    if (isDestPlanet) {
      drawArrivalArrow(pos.x, pos.y, drawR + 14);
    }

    // Glow
    if (planet.glow && drawR > 3) {
      const gradient = ctx.createRadialGradient(pos.x, pos.y, drawR, pos.x, pos.y, drawR * 3);
      gradient.addColorStop(0, planet.glow);
      gradient.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, drawR * 3, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    // Body
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, drawR, 0, Math.PI * 2);
    ctx.fillStyle = planet.color;
    ctx.fill();

    // Saturn rings
    if (planet.ring && drawR > 3) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, drawR * 2.2, drawR * 0.5, -0.2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(210, 180, 120, 0.6)';
      ctx.lineWidth = Math.max(1, drawR * 0.25);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, drawR * 1.7, drawR * 0.38, -0.2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(190, 160, 100, 0.35)';
      ctx.lineWidth = Math.max(0.5, drawR * 0.15);
      ctx.stroke();
      ctx.restore();
    }

    // Label
    if (drawR > 2.5 || planet.name === 'Earth' || isDestPlanet) {
      const arrived = isDestPlanet && arrivalAmount > 0;
      const fontSize = arrived ? 18 : Math.max(14, Math.min(16, drawR * 1.2));
      ctx.font = `${arrived ? '600' : '400'} ${fontSize}px 'Segoe UI', system-ui, sans-serif`;
      ctx.fillStyle = arrived ? `rgba(126, 184, 255, ${0.5 + arrivalAmount * 0.5})` :
                      isDestPlanet ? 'rgba(126, 184, 255, 0.8)' : 'rgba(255,255,255,0.6)';
      ctx.textAlign = 'left';
      ctx.fillText(planet.name, pos.x + drawR + 8, pos.y + 4);
    }
  }
}

// --- Milky Way ---
function drawMilkyWayObjects(time) {
  for (const obj of galacticObjects) {
    const pos = toScreen(obj.x, obj.y);
    if (pos.x < -100 || pos.x > cssWidth + 100 || pos.y < -100 || pos.y > cssHeight + 100) continue;

    const zoomFactor = camZoom / (cssHeight * 2);
    const drawR = Math.max(2, Math.min(obj.baseR * Math.sqrt(zoomFactor), 20));

    const isDest = obj.name === currentDest.name;
    const isSource = obj.name === 'Solar System';

    // Arrival arrow
    if (isDest) {
      drawArrivalArrow(pos.x, pos.y, drawR + 14);
    }

    // Solar System gets icon, others get dot
    if (isSource) {
      drawSolarSystemIcon(pos);
    } else {
      // Glow
      if (obj.glow && drawR > 2.5) {
        const gradient = ctx.createRadialGradient(pos.x, pos.y, drawR, pos.x, pos.y, drawR * 3);
        gradient.addColorStop(0, obj.glow);
        gradient.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, drawR * 3, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      }

      // Body
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, drawR, 0, Math.PI * 2);
      ctx.fillStyle = obj.color;
      ctx.fill();
    }

    // Label
    if (drawR > 1.5 || isDest || isSource) {
      const arrived = isDest && arrivalAmount > 0;
      const labelR = isSource ? drawR * 2.5 : drawR;
      const fontSize = arrived ? 18 : Math.max(14, Math.min(16, drawR * 1.3));
      ctx.font = `${arrived ? '600' : '400'} ${fontSize}px 'Segoe UI', system-ui, sans-serif`;
      ctx.fillStyle = arrived ? `rgba(126, 184, 255, ${0.5 + arrivalAmount * 0.5})` :
                      isDest ? 'rgba(126, 184, 255, 0.9)' : 'rgba(255,255,255,0.55)';
      if (obj.x >= 0) {
        ctx.textAlign = 'left';
        ctx.fillText(obj.name, pos.x + labelR + 8, pos.y + 4);
      } else {
        ctx.textAlign = 'right';
        ctx.fillText(obj.name, pos.x - labelR - 8, pos.y + 4);
      }
    }
  }
}

// --- Extragalactic ---
function drawExtragalacticObjects(time, progress) {
  const destY = getDestY(currentDest);
  const journeySpan = destY - EXTRA_EARTH_Y;

  // Milky Way spiral — fades in as we zoom out
  const mwAlpha = Math.min(1, Math.max(0, (progress - 0.08) / 0.20));
  if (mwAlpha > 0) {
    // Core glow
    const corePos = toScreen(extraCoreGlow.x, extraCoreGlow.y);
    const coreR = extraCoreGlow.radius * camZoom;
    if (coreR > 2 && coreR < cssWidth * 2) {
      const drawR = Math.min(coreR, 150);
      const gradient = ctx.createRadialGradient(corePos.x, corePos.y, 0, corePos.x, corePos.y, drawR);
      gradient.addColorStop(0, `rgba(255, 240, 200, ${mwAlpha * 0.4})`);
      gradient.addColorStop(0.3, `rgba(255, 220, 150, ${mwAlpha * 0.15})`);
      gradient.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(corePos.x, corePos.y, drawR, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    // Spiral arm stars
    for (const star of spiralStars) {
      const pos = toScreen(star.x, star.y);
      if (pos.x < -5 || pos.x > cssWidth + 5 || pos.y < -5 || pos.y > cssHeight + 5) continue;
      const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
      const alpha = mwAlpha * star.brightness * (0.3 + 0.7 * twinkle);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, star.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(230, 220, 200, ${alpha})`;
      ctx.fill();
    }

    // Milky Way reference landmarks — fade in with spiral, fade out later
    const lmFadeIn  = Math.min(1, Math.max(0, (progress - 0.05) / 0.10));
    const lmFadeOut = Math.min(1, Math.max(0, (progress - 0.65) / 0.15));
    const lmAlpha = lmFadeIn * (1 - lmFadeOut);
    if (lmAlpha > 0) {
      for (const lm of extraMilkyWayLandmarks) {
        const pos = toScreen(lm.x, lm.y);
        if (pos.y < -50 || pos.y > cssHeight + 50) continue;

        const dotR = 2;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, dotR, 0, Math.PI * 2);
        ctx.fillStyle = lm.color;
        ctx.globalAlpha = lmAlpha * 0.7;
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.font = `400 12px "Segoe UI", system-ui, sans-serif`;
        ctx.fillStyle = `rgba(255,255,255,${lmAlpha * 0.55})`;
        if (lm.x >= 0) {
          ctx.textAlign = 'left';
          ctx.fillText(lm.name, pos.x + 8, pos.y + 4);
        } else {
          ctx.textAlign = 'right';
          ctx.fillText(lm.name, pos.x - 8, pos.y + 4);
        }
      }
    }

    // Milky Way label
    if (mwAlpha > 0.5) {
      const labelPos = toScreen(extraMilkyWayPos.x + 0.12, extraMilkyWayPos.y);
      if (labelPos.y > 0 && labelPos.y < cssHeight) {
        ctx.font = '14px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = `rgba(255,255,255,${mwAlpha * 0.5})`;
        ctx.textAlign = 'left';
        ctx.fillText('Milky Way', labelPos.x, labelPos.y);
      }
    }
  }

  // --- Draw all galaxies between Earth and destination ---
  // Each galaxy fades in based on how far along the journey it sits
  for (const g of extraGalaxies) {
    // Only draw galaxies up to (and including) the destination
    if (g.y > destY + 0.01) continue;

    const isDest = g.name === currentDest.name;

    // Fade timing: based on galaxy's position in the journey
    // Closer galaxies appear earlier, destination appears later
    const journeyFrac = (g.y - EXTRA_EARTH_Y) / journeySpan; // 0..1 along the trip
    const fadeInStart = 0.15 + journeyFrac * 0.45;            // spread across 0.15..0.60
    const galAlpha = Math.min(1, Math.max(0, (progress - fadeInStart) / 0.20));
    if (galAlpha <= 0) continue;

    const galPos = toScreen(g.x, g.y);

    // Arrival arrow (destination only)
    if (isDest && arrivalAmount > 0) {
      drawArrivalArrow(galPos.x, galPos.y, 20);
    }

    // Core glow
    const coreR = g.coreRadius * camZoom;
    if (coreR > 1 && coreR < cssWidth) {
      const drawR = Math.min(coreR, g.edgeOn ? 80 : 100);
      const gradient = ctx.createRadialGradient(galPos.x, galPos.y, 0, galPos.x, galPos.y, drawR);
      gradient.addColorStop(0, `rgba(${g.coreColor}, ${galAlpha * 0.35})`);
      gradient.addColorStop(0.4, `rgba(${g.coreColor}, ${galAlpha * 0.1})`);
      gradient.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(galPos.x, galPos.y, drawR, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    // Galaxy stars (spiral or disc)
    for (const star of g.stars) {
      const pos = toScreen(star.x, star.y);
      if (pos.x < -5 || pos.x > cssWidth + 5 || pos.y < -5 || pos.y > cssHeight + 5) continue;
      const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
      const alpha = galAlpha * star.brightness * (0.3 + 0.7 * twinkle);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, star.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${g.starColor}, ${alpha})`;
      ctx.fill();
    }

    // Label
    if (galAlpha > 0.3) {
      const labelOffset = g.edgeOn ? -0.003 : -0.04; // tighter for edge-on disc
      const labelPos = toScreen(g.x, g.y + labelOffset);
      if (labelPos.y > 0 && labelPos.y < cssHeight) {
        const arrived = isDest && arrivalAmount > 0;
        const fontSize = arrived ? 18 : 14;
        ctx.font = `${arrived ? '600' : '400'} ${fontSize}px "Segoe UI", system-ui, sans-serif`;
        ctx.fillStyle = arrived ? `rgba(126, 184, 255, ${0.5 + arrivalAmount * 0.5})` :
                        `rgba(255,255,255,${galAlpha * 0.5})`;
        ctx.textAlign = 'center';
        ctx.fillText(g.name, labelPos.x, labelPos.y);
      }
    }
  }

  // Solar System icon (always on top)
  const ssPos = toScreen(0, EXTRA_EARTH_Y);
  const ssR = drawSolarSystemIcon(ssPos);

  // Solar System label
  if (ssR > 8) {
    const labelR = ssR * 2.5;
    ctx.font = `400 ${Math.max(14, Math.min(16, ssR * 0.4))}px 'Segoe UI', system-ui, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.textAlign = 'left';
    ctx.fillText('Solar System', ssPos.x + labelR + 8, ssPos.y + 4);
  }
}

// =============================================================
// 11. FRAME LOOP — one loop, dispatches to category draws
// =============================================================
let startTime = null;
let animId = null;
let duration = 6000;

function frame(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;
  const progress = Math.min(1, elapsed / duration);
  const time = timestamp / 1000;

  const cam = getCameraState(progress);
  camX = cam.cx;
  camY = cam.cy;
  camZoom = cam.zoom;

  // Clear
  ctx.fillStyle = '#030308';
  ctx.fillRect(0, 0, cssWidth, cssHeight);

  // Arrival ramp
  arrivalAmount = Math.min(1, Math.max(0,
    (progress - CONFIG.ARRIVAL_START) / (CONFIG.ARRIVAL_END - CONFIG.ARRIVAL_START)));

  // Draw layers
  drawStars(time);

  // Category-specific objects
  switch (currentDest.category) {
    case 'Solar System':
      drawSolarSystemObjects(time);
      break;
    case 'Milky Way':
      drawMilkyWayObjects(time);
      break;
    case 'Extragalactic':
      drawExtragalacticObjects(time, progress);
      break;
  }

  drawTrail(progress);

  if (progress < 1) {
    animId = requestAnimationFrame(frame);
  }
}

// =============================================================
// 12. UI — dropdown with all 15 destinations, Go button
// =============================================================
function launchTo(destName) {
  const dest = DESTINATIONS.find(d => d.name === destName);
  if (!dest) return;
  currentDest = dest;

  document.title = `Earth \u2192 ${destName}`;

  // Set duration based on category
  const durationKey = 'DURATION_' + dest.category.replace(' ', '_').toUpperCase();
  // Map category to config key
  switch (dest.category) {
    case 'Solar System':    duration = CONFIG.DURATION_SOLAR; break;
    case 'Milky Way':       duration = CONFIG.DURATION_MILKYWAY; break;
    case 'Extragalactic':   duration = CONFIG.DURATION_EXTRAGALACTIC; break;
  }

  computeFraming(dest);

  if (animId) cancelAnimationFrame(animId);
  startTime = null;
  arrivalAmount = 0;
  animId = requestAnimationFrame(frame);
}

// Populate dropdown with optgroups
const select = document.getElementById('dest-select');
const categories = ['Solar System', 'Milky Way', 'Extragalactic'];
for (const cat of categories) {
  const group = document.createElement('optgroup');
  group.label = cat;
  for (const dest of DESTINATIONS.filter(d => d.category === cat)) {
    const opt = document.createElement('option');
    opt.value = dest.name;
    opt.textContent = `${dest.name} (${dest.distLabel})`;
    if (dest.name === 'Saturn') opt.selected = true;
    group.appendChild(opt);
  }
  select.appendChild(group);
}

// Auto-start with Saturn
launchTo('Saturn');
</script>
