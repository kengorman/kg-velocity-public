<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Saturn with rings -->
  <ellipse cx="30" cy="30" rx="28" ry="8" fill="none" stroke="currentColor" stroke-width="3"/>
  <circle cx="30" cy="30" r="14" fill="currentColor"/>
  <ellipse cx="30" cy="30" rx="28" ry="8" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"
    clip-path="url(#saturn-clip)"/>
  <defs>
    <clipPath id="saturn-clip">
      <rect x="0" y="30" width="60" height="30"/>
    </clipPath>
  </defs>
