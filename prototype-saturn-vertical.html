<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth → Saturn (Vertical)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  canvas { display: block; }
  #overlay {
    position: fixed; bottom: 40px; left: 0; right: 0;
    text-align: center; font-family: 'Segoe UI', system-ui, sans-serif;
    pointer-events: none; z-index: 10;
  }
  #trip-data {
    display: inline-block; padding: 20px 32px;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.8s ease;
  }
  #trip-data.visible { opacity: 1; }
  #trip-data h2 { color: #fff; font-size: 16px; font-weight: 300; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
  #trip-data .stats { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  #trip-data .stat { text-align: center; }
  #trip-data .stat .value { color: #7eb8ff; font-size: 20px; font-weight: 600; }
  #trip-data .stat .label { color: rgba(255,255,255,0.5); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  #arrival-card {
    position: fixed; top: 50%; left: 0; right: 0; transform: translateY(-50%);
    text-align: center; pointer-events: none; z-index: 10;
    font-family: 'Segoe UI', system-ui, sans-serif;
    opacity: 0; transition: opacity 1s ease;
  }
  #arrival-card.visible { opacity: 1; }
  #arrival-card .dest { color: #fff; font-size: 36px; font-weight: 200; letter-spacing: 6px; text-transform: uppercase; }
  #arrival-card .tagline { color: rgba(255,255,255,0.4); font-size: 13px; letter-spacing: 3px; margin-top: 8px; }
  #restart {
    position: fixed; top: 20px; right: 20px; z-index: 20;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
  }
  #restart:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="arrival-card"><div class="dest">Saturn</div><div class="tagline">886 million miles from home</div></div>
<div id="overlay">
  <div id="trip-data">
    <h2>Earth → Saturn at 99% Speed of Light</h2>
    <div class="stats">
      <div class="stat"><div class="value">11 min</div><div class="label">Ship Time</div></div>
      <div class="stat"><div class="value">1 hr 20 min</div><div class="label">Earth Time</div></div>
      <div class="stat"><div class="value">886M mi</div><div class="label">Distance</div></div>
      <div class="stat"><div class="value">7.09×</div><div class="label">Time Dilation</div></div>
    </div>
  </div>
</div>
<button id="restart" onclick="startAnimation()">Replay</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- Config ---
const DURATION = 6000; // ms

// Planet data: [name, distanceAU, radius (visual px at 1x zoom), color, hasRings]
// Planets are laid out along the Y-axis (AU = vertical position)
const planets = [
  { name: 'Sun',     au: 0,    baseR: 18, color: '#FDB813', glow: '#FDB81350', ring: false },
  { name: 'Mercury', au: 0.39, baseR: 3,  color: '#8c7e6d', glow: null, ring: false },
  { name: 'Venus',   au: 0.72, baseR: 5,  color: '#c9a860', glow: null, ring: false },
  { name: 'Earth',   au: 1.0,  baseR: 5.5,color: '#4a90d9', glow: '#4a90d940', ring: false },
  { name: 'Mars',    au: 1.52, baseR: 4,  color: '#c1440e', glow: null, ring: false },
  { name: 'Jupiter', au: 5.2,  baseR: 12, color: '#c88b3a', glow: '#c88b3a20', ring: false },
  { name: 'Saturn',  au: 9.5,  baseR: 10, color: '#d4a94b', glow: '#d4a94b30', ring: true },
];

// Stars (parallax layers)
const starLayers = [];
for (let layer = 0; layer < 3; layer++) {
  const stars = [];
  const count = 300 + layer * 200;
  for (let i = 0; i < count; i++) {
    stars.push({
      x: (Math.random() - 0.5) * 40, // AU spread horizontally
      y: (Math.random() - 0.5) * 40, // AU spread vertically
      brightness: 0.2 + Math.random() * 0.8,
      size: 0.5 + Math.random() * (1.5 - layer * 0.3),
      twinkleSpeed: 1 + Math.random() * 3,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
  starLayers.push({ stars, parallax: 0.3 + layer * 0.35 });
}

// Camera state
let camX, camY, camZoom; // zoom = pixels per AU

// Easing
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// Convert AU coords to screen coords
// Y-axis is INVERTED: higher AU = higher on screen (lower screen Y)
function toScreen(auX, auY, parallax = 1.0) {
  const dx = (auX - camX) * parallax;
  const dy = (auY - camY) * parallax;
  return {
    x: canvas.width / 2 + dx * camZoom,
    y: canvas.height / 2 - dy * camZoom, // negated: +AU = up on screen
  };
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Animation: two phases ---
// Phase 1 (0–12%): Hold tight on Earth
// Phase 2 (12–100%): One continuous pull-back, slow at first then picks up speed
const HOLD_END = 0.12;

// Start and end states
const hold  = { cx: 0, cy: 1.0,  zoom: 900 }; // tight on Earth
const final = { cx: 0, cy: 5.25, zoom: 38 };   // settled, both visible

// Log of zoom bounds (for perceptually smooth zoom interpolation)
const LOG_ZOOM_START = Math.log(850);
const LOG_ZOOM_END = Math.log(final.zoom);

// Ease-in then gentle settle: slow departure, accelerates, slight cushion at end
function easeInCubicOut(t) {
  if (t < 0.85) {
    // Ease-in cubic for first 85%: slow start, picks up speed
    const st = t / 0.85;
    return 0.85 * (st * st * st);
  }
  // Gentle ease-out for final 15%: settle into place
  const st = (t - 0.85) / 0.15;
  return 0.85 + 0.15 * (1 - Math.pow(1 - st, 2));
}

function getCameraState(progress) {
  if (progress <= HOLD_END) {
    // Phase 1: hold on Earth, barely breathing
    const t = progress / HOLD_END;
    return { cx: hold.cx, cy: hold.cy, zoom: hold.zoom - t * 50 }; // subtle 900→850
  }
  // Phase 2: one continuous pull-back
  const t = (progress - HOLD_END) / (1 - HOLD_END);
  const e = easeInCubicOut(t);
  // Logarithmic zoom: keeps the pull-back perceptually even
  const logZoom = LOG_ZOOM_START + (LOG_ZOOM_END - LOG_ZOOM_START) * e;
  return {
    cx: hold.cx + (final.cx - hold.cx) * e,
    cy: hold.cy + (final.cy - hold.cy) * e,
    zoom: Math.exp(logZoom),
  };
}

// --- Journey trail ---
function drawTrail(progress) {
  const earthScreen = toScreen(0, 1.0);
  const saturnScreen = toScreen(0, 9.5);

  // Trail progress (ship traveling)
  const trailProgress = Math.min(1, Math.max(0, (progress - HOLD_END) / (1 - HOLD_END)));
  const trailEnd = {
    x: earthScreen.x + (saturnScreen.x - earthScreen.x) * easeInCubicOut(trailProgress),
    y: earthScreen.y + (saturnScreen.y - earthScreen.y) * easeInCubicOut(trailProgress),
  };

  if (trailProgress > 0) {
    // Dashed trail line
    ctx.save();
    ctx.setLineDash([4, 8]);
    ctx.strokeStyle = 'rgba(126, 184, 255, 0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(earthScreen.x, earthScreen.y);
    ctx.lineTo(trailEnd.x, trailEnd.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Ship dot
    if (trailProgress < 0.98) {
      ctx.beginPath();
      ctx.arc(trailEnd.x, trailEnd.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#7eb8ff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(trailEnd.x, trailEnd.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(126, 184, 255, 0.15)';
      ctx.fill();
    }
    ctx.restore();
  }
}

// --- Draw functions ---
function drawStars(time, progress) {
  for (const layer of starLayers) {
    for (const star of layer.stars) {
      const pos = toScreen(star.x, star.y, layer.parallax);
      if (pos.x < -10 || pos.x > canvas.width + 10 || pos.y < -10 || pos.y > canvas.height + 10) continue;

      const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
      const alpha = star.brightness * (0.4 + 0.6 * twinkle);

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, star.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();
    }
  }
}

function drawPlanet(planet, time) {
  const pos = toScreen(0, planet.au); // planets along Y-axis, X=0
  const r = planet.baseR * (camZoom / 60); // scale with zoom (adjusted base for vertical zoom range)
  const minR = planet.name === 'Sun' ? 4 : 1.5;
  const drawR = Math.max(minR, Math.min(r, planet.name === 'Sun' ? 60 : 30));

  // Off screen check
  if (pos.x < -100 || pos.x > canvas.width + 100 || pos.y < -100 || pos.y > canvas.height + 100) return;

  // Glow
  if (planet.glow && drawR > 3) {
    const gradient = ctx.createRadialGradient(pos.x, pos.y, drawR, pos.x, pos.y, drawR * 3);
    gradient.addColorStop(0, planet.glow);
    gradient.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, drawR * 3, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
  }

  // Planet body
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, drawR, 0, Math.PI * 2);
  ctx.fillStyle = planet.color;
  ctx.fill();

  // Saturn rings
  if (planet.ring && drawR > 3) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y, drawR * 2.2, drawR * 0.5, -0.2, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(210, 180, 120, 0.6)';
    ctx.lineWidth = Math.max(1, drawR * 0.25);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y, drawR * 1.7, drawR * 0.38, -0.2, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(190, 160, 100, 0.35)';
    ctx.lineWidth = Math.max(0.5, drawR * 0.15);
    ctx.stroke();
    ctx.restore();
  }

  // Label — to the right of the planet
  if (drawR > 2.5 || planet.name === 'Earth' || planet.name === 'Saturn') {
    ctx.font = `${Math.max(10, Math.min(14, drawR * 1.2))}px 'Segoe UI', system-ui, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.textAlign = 'left';
    ctx.fillText(planet.name, pos.x + drawR + 8, pos.y + 4);
  }
}

function drawOrbitHints() {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (const p of planets) {
    if (p.au === 0) continue;
    const center = toScreen(0, 0); // Sun position
    const r = p.au * camZoom;
    if (r > 5 && r < canvas.height * 3) {
      ctx.beginPath();
      ctx.arc(center.x, center.y, r, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// --- Main loop ---
let startTime = null;
let animId = null;

function frame(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;
  const progress = Math.min(1, elapsed / DURATION);
  const time = timestamp / 1000;

  // Update camera
  const cam = getCameraState(progress);
  camX = cam.cx;
  camY = cam.cy;
  camZoom = cam.zoom;

  // Clear
  ctx.fillStyle = '#030308';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw
  drawStars(time, progress);
  drawOrbitHints();
  drawTrail(progress);
  for (const p of planets) drawPlanet(p, time);

  // Arrival card: destination name fades in as camera settles on Saturn
  const arrivalEl = document.getElementById('arrival-card');
  if (progress > 0.75) {
    arrivalEl.classList.add('visible');
  }

  // Trip data: appears after arrival name
  const dataEl = document.getElementById('trip-data');
  if (progress > 0.88) {
    dataEl.classList.add('visible');
  }

  if (progress < 1) {
    animId = requestAnimationFrame(frame);
  }
}

function startAnimation() {
  if (animId) cancelAnimationFrame(animId);
  startTime = null;
  document.getElementById('trip-data').classList.remove('visible');
  document.getElementById('arrival-card').classList.remove('visible');
  animId = requestAnimationFrame(frame);
}

// Auto-start
startAnimation();
</script>
</body>
</html>
