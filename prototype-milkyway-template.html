<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milky Way Template</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  canvas { display: block; }
  #overlay {
    position: fixed; bottom: 40px; left: 0; right: 0;
    text-align: center; font-family: 'Segoe UI', system-ui, sans-serif;
    pointer-events: none; z-index: 10;
  }
  #trip-data {
    display: inline-block; padding: 20px 32px;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.8s ease;
  }
  #trip-data.visible { opacity: 1; }
  #trip-data h2 { color: #fff; font-size: 16px; font-weight: 300; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
  #trip-data .stats { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  #trip-data .stat { text-align: center; }
  #trip-data .stat .value { color: #7eb8ff; font-size: 20px; font-weight: 600; }
  #trip-data .stat .label { color: rgba(255,255,255,0.5); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  #controls {
    position: fixed; top: 20px; right: 20px; z-index: 20;
    display: flex; gap: 8px; align-items: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #dest-select {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 8px 12px; border-radius: 6px;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
  }
  #dest-select option { background: #1a1a2e; color: #fff; }
  #restart {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
  }
  #restart:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div id="trip-data">
    <h2 id="trip-heading"></h2>
    <div class="stats">
      <div class="stat"><div class="value" id="stat-dist">—</div><div class="label">Distance</div></div>
    </div>
  </div>
</div>
<div id="controls">
  <select id="dest-select"></select>
  <button id="restart" onclick="launchTo(document.getElementById('dest-select').value)">Go</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ====================================================================
// DESTINATIONS — all within the Milky Way galaxy
// ====================================================================
// Each destination specifies:
// - ly: distance in light-years (used for log-scale positioning)
// - tagline: descriptive text (not currently used in animation)
// - distLabel: formatted distance shown in trip data panel
const DESTINATIONS = {
  'Proxima Centauri':    { ly: 4.24,    tagline: '4.24 light-years from home',   distLabel: '4.24 ly' },
  'Polaris':             { ly: 433,     tagline: '433 light-years from home',    distLabel: '433 ly' },
  'Betelgeuse':          { ly: 700,     tagline: '700 light-years from home',    distLabel: '700 ly' },
  'Horsehead Nebula':    { ly: 1500,    tagline: '1,500 light-years from home',  distLabel: '1,500 ly' },
  'Crab Nebula':         { ly: 6500,    tagline: '6,500 light-years from home',  distLabel: '6,500 ly' },
  'Pillars of Creation': { ly: 6500,    tagline: '6,500 light-years from home',  distLabel: '6,500 ly' },
  'Milky Way Center':    { ly: 26000,   tagline: '26,000 light-years from home', distLabel: '26,000 ly' },
};

// ====================================================================
// TIMING CONFIGURATION
// ====================================================================
// currentDest: which destination to animate to on initial load
// DURATION: total animation time in milliseconds
let currentDest = 'Crab Nebula';
const DURATION = 6000;

// ====================================================================
// GALACTIC OBJECTS — landmarks along the vertical axis
// ====================================================================
// Uses logarithmic positioning so objects are spread evenly across
// the massive distance range (4.24 ly → 26,000 ly). Without log scale,
// Proxima would be invisible at Earth's feet.
//
// LOG_MIN/LOG_MAX: boundaries of the log scale (1 ly to 30,000 ly)
// lyToY(): converts light-years to normalized [0,1] vertical position
//
// Each object has:
// - name: displayed label
// - ly: distance in light-years (0 for Solar System = Earth position)
// - baseR: base dot radius (scales dynamically with zoom)
// - color: primary dot color
// - glow: radial gradient color with alpha (hex + opacity)
const LOG_MIN = Math.log10(1);     // 1 ly (below Proxima, gives Earth some room)
const LOG_MAX = Math.log10(30000); // just above MW center

// Convert light-years to normalized Y position [0, ~1]
function lyToY(ly) {
  if (ly <= 0) return 0;
  return (Math.log10(ly) - LOG_MIN) / (LOG_MAX - LOG_MIN);
}

// All galactic landmarks — always present, drawn as dots + labels
const galacticObjects = [
  { name: 'Solar System',        ly: 0,     baseR: 5,  color: '#4a90d9', glow: '#4a90d940' },
  { name: 'Proxima Centauri',    ly: 4.24,  baseR: 4,  color: '#ff6b4a', glow: '#ff6b4a30' },
  { name: 'Polaris',             ly: 433,   baseR: 5,  color: '#fffbe0', glow: '#fffbe040' },
  { name: 'Betelgeuse',          ly: 700,   baseR: 7,  color: '#ff4500', glow: '#ff450040' },
  { name: 'Horsehead Nebula',    ly: 1500,  baseR: 6,  color: '#8b4585', glow: '#8b458540' },
  { name: 'Crab Nebula',         ly: 6500,  baseR: 6,  color: '#4ecdc4', glow: '#4ecdc430' },
  { name: 'Pillars of Creation', ly: 6500,  baseR: 6,  color: '#c79a3e', glow: '#c79a3e30' },
  { name: 'Milky Way Center',    ly: 26000, baseR: 8,  color: '#ffd700', glow: '#ffd70050' },
];

// Precompute Y positions using log scale
for (const obj of galacticObjects) {
  obj.y = lyToY(obj.ly);
}

// Slight X offsets so labels don't all stack on center axis
// Alternate left/right for readability
const xOffsets = [0, 0.01, -0.01, 0.015, -0.015, 0.01, -0.01, 0];
galacticObjects.forEach((obj, i) => { obj.x = xOffsets[i] || 0; });

// Pillars of Creation — same ly as Crab Nebula, nudge apart visually
galacticObjects.find(o => o.name === 'Pillars of Creation').y += 0.02;

// ====================================================================
// BACKGROUND STARS — parallax starfield
// ====================================================================
// Three layers with different parallax values create depth. Lower
// parallax (0.1) = far stars that move slower, higher parallax (0.4) =
// near stars that move faster with camera motion.
//
// Tweak these to adjust star density and atmosphere:
// - count: number of stars per layer
// - spread: how far stars are distributed in normalized space
// - parallax: motion multiplier (lower = farther/slower)
// - brightness: 0.2-1.0 range, multiplied by twinkle
// - size: pixel radius of each star dot
// - twinkleSpeed: how fast the star pulses (radians/second)
const starLayerDefs = [
  { count: 1200, spread: 10, parallax: 0.1 },  // Distant background
  { count: 900,  spread: 6,  parallax: 0.2 },  // Mid-depth
  { count: 600,  spread: 3,  parallax: 0.4 },  // Foreground
];
const starLayers = [];
for (const def of starLayerDefs) {
  const stars = [];
  for (let i = 0; i < def.count; i++) {
    stars.push({
      x: (Math.random() - 0.5) * def.spread,
      y: (Math.random() - 0.5) * def.spread + 0.5,
      brightness: 0.2 + Math.random() * 0.8,
      size: 0.5 + Math.random() * 1.2,
      twinkleSpeed: 1 + Math.random() * 3,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
  starLayers.push({ stars, parallax: def.parallax });
}

// ====================================================================
// CAMERA STATE — current view position and zoom level
// ====================================================================
// camX, camY: normalized world coordinates the camera is centered on
// camZoom: pixels per normalized unit (higher = more zoomed in)
let camX, camY, camZoom;

// ====================================================================
// CAMERA FRAMING — start/end positions computed per destination
// ====================================================================
// hold: tight frame on Earth at animation start
// finalState: pulled-back frame showing Earth + destination
// LOG_ZOOM_START/END: log-scale zoom values for smooth interpolation
// destY: normalized Y position of current destination
//
// Tweak these multipliers to adjust framing:
// - hold.zoom (screenH * 12): how tight the initial Earth view is
// - finalState.zoom multipliers: how much padding around Earth+destination
let hold, finalState, LOG_ZOOM_START, LOG_ZOOM_END;
let destY = 0;

function computeAnimParams(destName) {
  const dest = DESTINATIONS[destName];
  destY = lyToY(dest.ly);

  const screenH = canvas.height || 800;
  const midpoint = destY / 2;

  // Final zoom: fit Earth (y=0) and destination (y=destY) with padding
  const finalZoom = Math.max(screenH * 0.4, (screenH * 0.55) / Math.max(destY, 0.15));

  hold = { cx: 0, cy: 0.0, zoom: screenH * 12 };
  finalState = { cx: 0, cy: midpoint, zoom: finalZoom };

  LOG_ZOOM_START = Math.log(hold.zoom * 0.94);
  LOG_ZOOM_END = Math.log(finalState.zoom);
}

// ====================================================================
// EASING FUNCTIONS — motion curves for smooth animation
// ====================================================================
// easeInOutCubic: symmetric ease-in/ease-out (not currently used)
// easeInCubicOut: slow start (cubic), fast middle, gentle landing (quadratic)
//   - Tweak the 0.85 breakpoint to adjust acceleration phase duration
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function easeInCubicOut(t) {
  if (t < 0.85) {
    const st = t / 0.85;
    return 0.85 * (st * st * st);
  }
  const st = (t - 0.85) / 0.15;
  return 0.85 + 0.15 * (1 - Math.pow(1 - st, 2));
}

// ====================================================================
// COORDINATE CONVERSION — normalized world space to screen pixels
// ====================================================================
// Takes normalized coordinates (nx, ny) and converts to canvas pixel position
// based on current camera state. Parallax parameter creates depth layers:
// parallax < 1.0 = farther objects that move slower with camera
function toScreen(nx, ny, parallax = 1.0) {
  const dx = (nx - camX) * parallax;
  const dy = (ny - camY) * parallax;
  return {
    x: canvas.width / 2 + dx * camZoom,
    y: canvas.height / 2 - dy * camZoom,
  };
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ====================================================================
// CAMERA ANIMATION — interpolates from hold to finalState over time
// ====================================================================
// HOLD_END: progress value (0-1) where hold phase ends and zoom-out begins
//   - Tweak this to adjust how long the camera stays tight on Earth
//   - 0.10 = 10% of animation is hold, 90% is zoom-out
//
// During hold (0 to HOLD_END): camera stays on Earth, subtle zoom-out (6%)
// After hold: logarithmic zoom-out from Earth to final framing
const HOLD_END = 0.10;

function getCameraState(progress) {
  if (progress <= HOLD_END) {
    const t = progress / HOLD_END;
    return { cx: hold.cx, cy: hold.cy, zoom: hold.zoom - t * (hold.zoom * 0.06) };
  }
  const t = (progress - HOLD_END) / (1 - HOLD_END);
  const e = easeInCubicOut(t);
  const logZoom = LOG_ZOOM_START + (LOG_ZOOM_END - LOG_ZOOM_START) * e;
  return {
    cx: hold.cx + (finalState.cx - hold.cx) * e,
    cy: hold.cy + (finalState.cy - hold.cy) * e,
    zoom: Math.exp(logZoom),
  };
}

// ====================================================================
// ARRIVAL HIGHLIGHT — blue arrow + bold label at destination
// ====================================================================
// arrivalAmount: 0 to 1, fades in during final 15% of animation
// Controlled in main loop: (progress - 0.75) / 0.15
let arrivalAmount = 0;

// ====================================================================
// SOLAR SYSTEM ICON — tiny sun + 4 orbit rings for Earth position
// ====================================================================
// Drawn instead of a simple dot for "Solar System" galactic object.
// Scales dynamically with zoom so it's visible at all distances.
//
// Tweak these for visual style:
// - r multiplier (camZoom * 0.008): base size scaling
// - orbits array: relative orbit radii
// - planetColors/planetSizes: appearance of planet dots on rings
// - ellipse y-radius (orbitR * 0.35) and rotation (-0.3): tilt angle
function drawSolarSystemIcon(pos) {
  // Scale directly with zoom: big when close, shrinks as we pull back
  const r = Math.max(3, Math.min(60, camZoom * 0.008));

  // Orbit rings (tilted ellipses)
  const orbits = [0.35, 0.55, 0.75, 1.0];
  const planetColors = ['#c1440e', '#c88b3a', '#d4a94b', '#3f54ba'];
  const planetSizes = [0.8, 1.4, 1.2, 0.9];

  ctx.save();
  for (let i = 0; i < orbits.length; i++) {
    const orbitR = r * orbits[i] * 2.5;

    // Orbit ring
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y, orbitR, orbitR * 0.35, -0.3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Planet dot on ring
    const angle = i * 1.8 + 0.5; // spread them around
    const px = pos.x + orbitR * Math.cos(angle);
    const py = pos.y + orbitR * 0.35 * Math.sin(angle - 0.3);
    const dotR = Math.max(0.8, planetSizes[i]);
    ctx.beginPath();
    ctx.arc(px, py, dotR, 0, Math.PI * 2);
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = planetColors[i];
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Sun glow
  const gradient = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, r * 0.8);
  gradient.addColorStop(0, 'rgba(253, 184, 19, 0.5)');
  gradient.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, r * 0.8, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();

  // Sun dot
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, Math.max(1.5, r * 0.18), 0, Math.PI * 2);
  ctx.fillStyle = '#FDB813';
  ctx.fill();
  ctx.restore();
}

// ====================================================================
// GALACTIC OBJECT RENDERING — dots, glows, labels, arrival indicator
// ====================================================================
// Draws all galactic landmarks (Solar System, Proxima, nebulae, etc.)
// with dynamic sizing based on zoom level.
//
// Tweak these for visual appearance:
// - drawR calculation: controls how object size scales with zoom
// - glow radius multiplier (drawR * 3): size of radial gradient
// - arrival arrow position/size: offset and triangle dimensions
// - label fontSize calculation: how labels scale with zoom
// - label colors/opacity: text appearance for different states
function drawGalacticObjects(time) {
  for (const obj of galacticObjects) {
    const pos = toScreen(obj.x, obj.y);

    if (pos.x < -100 || pos.x > canvas.width + 100 || pos.y < -100 || pos.y > canvas.height + 100) continue;

    const zoomFactor = camZoom / (canvas.height * 2);
    const drawR = Math.max(2, Math.min(obj.baseR * Math.sqrt(zoomFactor), 20));

    const isDest = obj.name === currentDest;
    const isEarth = obj.name === 'Solar System';

    // Arrival arrow — points at the destination from the left
    if (isDest && arrivalAmount > 0) {
      const arrowX = pos.x - drawR - 14;
      const arrowY = pos.y;
      const size = 5;
      const alpha = arrivalAmount * 0.9;
      ctx.save();
      ctx.fillStyle = `rgba(126, 184, 255, ${alpha})`;
      ctx.beginPath();
      ctx.moveTo(arrowX + size, arrowY);
      ctx.lineTo(arrowX - size, arrowY - size);
      ctx.lineTo(arrowX - size, arrowY + size);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Solar System gets special rendering
    if (isEarth) {
      drawSolarSystemIcon(pos);
    } else {
      // Glow
      if (obj.glow && drawR > 2.5) {
        const gradient = ctx.createRadialGradient(pos.x, pos.y, drawR, pos.x, pos.y, drawR * 3);
        gradient.addColorStop(0, obj.glow);
        gradient.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, drawR * 3, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      }

      // Body
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, drawR, 0, Math.PI * 2);
      ctx.fillStyle = obj.color;
      ctx.fill();
    }

    // Label
    if (drawR > 1.5 || isDest || isEarth) {
      const arrived = isDest && arrivalAmount > 0;
      const labelR = isEarth ? drawR * 2.5 : drawR; // push label out past orbit rings
      const fontSize = arrived ? 14 : Math.max(9, Math.min(13, drawR * 1.3));
      ctx.font = `${arrived ? '600' : '400'} ${fontSize}px 'Segoe UI', system-ui, sans-serif`;
      ctx.fillStyle = arrived ? `rgba(126, 184, 255, ${0.5 + arrivalAmount * 0.5})` :
                      isDest ? 'rgba(126, 184, 255, 0.9)' : 'rgba(255,255,255,0.55)';
      if (obj.x >= 0) {
        ctx.textAlign = 'left';
        ctx.fillText(obj.name, pos.x + labelR + 8, pos.y + 4);
      } else {
        ctx.textAlign = 'right';
        ctx.fillText(obj.name, pos.x - labelR - 8, pos.y + 4);
      }
    }
  }
}

// ====================================================================
// BACKGROUND STARFIELD — renders parallax star layers with twinkle
// ====================================================================
// Draws all star layers with their respective parallax offsets.
// Twinkle effect uses sine wave based on time and per-star offset.
//
// Tweak these in the twinkle calculation:
// - 0.5 + 0.5 * sin(): oscillates between 0 and 1
// - 0.3 + 0.7 * twinkle: minimum 30% brightness, max 100%
function drawStars(time) {
  for (const layer of starLayers) {
    for (const star of layer.stars) {
      const pos = toScreen(star.x, star.y, layer.parallax);
      if (pos.x < -5 || pos.x > canvas.width + 5 || pos.y < -5 || pos.y > canvas.height + 5) continue;
      const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
      const alpha = star.brightness * (0.3 + 0.7 * twinkle);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, star.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();
    }
  }
}

// ====================================================================
// SHIP TRAIL — dashed line from Earth to destination with moving dot
// ====================================================================
// Draws during zoom-out phase (after HOLD_END). Trail and ship dot
// animate from Earth toward destination using same easing as camera.
//
// Tweak these for visual style:
// - setLineDash([4, 8]): dash pattern (4px line, 8px gap)
// - strokeStyle opacity: trail visibility
// - ship dot radii (3px core, 8px glow): size of moving ship indicator
// - 0.98 threshold: when to hide ship dot (near arrival)
function drawTrail(progress) {
  const earthPos = toScreen(0, 0);
  const destObj = galacticObjects.find(o => o.name === currentDest);
  const destPos = toScreen(destObj ? destObj.x : 0, destY);

  const trailProgress = Math.min(1, Math.max(0, (progress - HOLD_END) / (1 - HOLD_END)));
  const trailEnd = {
    x: earthPos.x + (destPos.x - earthPos.x) * easeInCubicOut(trailProgress),
    y: earthPos.y + (destPos.y - earthPos.y) * easeInCubicOut(trailProgress),
  };

  if (trailProgress > 0) {
    ctx.save();
    ctx.setLineDash([4, 8]);
    ctx.strokeStyle = 'rgba(126, 184, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(earthPos.x, earthPos.y);
    ctx.lineTo(trailEnd.x, trailEnd.y);
    ctx.stroke();
    ctx.setLineDash([]);

    if (trailProgress < 0.98) {
      ctx.beginPath();
      ctx.arc(trailEnd.x, trailEnd.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#7eb8ff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(trailEnd.x, trailEnd.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(126, 184, 255, 0.12)';
      ctx.fill();
    }
    ctx.restore();
  }
}

// ====================================================================
// MAIN ANIMATION LOOP — requestAnimationFrame tick
// ====================================================================
// Runs every frame, updates camera, draws all layers.
//
// Tweak these timing values:
// - arrivalAmount calculation (0.75, 0.15): when arrival highlight fades in
//   - Currently: starts at 75% progress, reaches full by 90%
// - trip-data visibility (0.88): when bottom panel fades in
//
// Draw order (back to front):
// 1. Background fill
// 2. Stars (parallax layers)
// 3. Ship trail
// 4. Galactic objects + labels
let startTime = null;
let animId = null;

function frame(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;
  const progress = Math.min(1, elapsed / DURATION);
  const time = timestamp / 1000;

  const cam = getCameraState(progress);
  camX = cam.cx;
  camY = cam.cy;
  camZoom = cam.zoom;

  ctx.fillStyle = '#030308';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  arrivalAmount = Math.min(1, Math.max(0, (progress - 0.75) / 0.15));

  drawStars(time);
  drawTrail(progress);
  drawGalacticObjects(time);

  // Trip data panel fade-in
  if (progress > 0.88) {
    document.getElementById('trip-data').classList.add('visible');
  }

  if (progress < 1) {
    animId = requestAnimationFrame(frame);
  }
}

// ====================================================================
// LAUNCH FUNCTION — starts/restarts animation to chosen destination
// ====================================================================
// Called on page load and when user clicks "Go" button.
// Resets all animation state and kicks off new requestAnimationFrame loop.
function launchTo(destName) {
  currentDest = destName;
  const dest = DESTINATIONS[destName];

  document.getElementById('trip-heading').textContent = `Earth → ${destName}`;
  document.getElementById('stat-dist').textContent = dest.distLabel;
  document.title = `Earth → ${destName}`;

  computeAnimParams(destName);

  if (animId) cancelAnimationFrame(animId);
  startTime = null;
  document.getElementById('trip-data').classList.remove('visible');
  arrivalAmount = 0;
  animId = requestAnimationFrame(frame);
}

// ====================================================================
// DROPDOWN POPULATION — build destination selector from DESTINATIONS
// ====================================================================
const select = document.getElementById('dest-select');
for (const name of Object.keys(DESTINATIONS)) {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name;
  if (name === currentDest) opt.selected = true;
  select.appendChild(opt);
}

launchTo(currentDest);
</script>
</body>
</html>
