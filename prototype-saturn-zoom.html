<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Earth → Saturn</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  canvas { display: block; }
  #overlay {
    position: fixed; bottom: 40px; left: 0; right: 0;
    text-align: center; font-family: 'Segoe UI', system-ui, sans-serif;
    pointer-events: none; z-index: 10;
  }
  #trip-data {
    display: inline-block; padding: 20px 40px;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.8s ease;
  }
  #trip-data.visible { opacity: 1; }
  #trip-data h2 { color: #fff; font-size: 20px; font-weight: 300; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
  #trip-data .stats { display: flex; gap: 40px; justify-content: center; }
  #trip-data .stat { text-align: center; }
  #trip-data .stat .value { color: #7eb8ff; font-size: 24px; font-weight: 600; }
  #trip-data .stat .label { color: rgba(255,255,255,0.5); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  #title-card {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; pointer-events: none; z-index: 10;
    font-family: 'Segoe UI', system-ui, sans-serif;
    opacity: 0; transition: opacity 0.6s ease;
  }
  #title-card.visible { opacity: 1; }
  #title-card .dest { color: #fff; font-size: 42px; font-weight: 200; letter-spacing: 6px; text-transform: uppercase; }
  #title-card .tagline { color: rgba(255,255,255,0.4); font-size: 14px; letter-spacing: 3px; margin-top: 8px; }
  #restart {
    position: fixed; top: 20px; right: 20px; z-index: 20;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
  }
  #restart:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title-card"><div class="dest">Saturn</div><div class="tagline">The ringed giant — 886 million miles</div></div>
<div id="overlay">
  <div id="trip-data">
    <h2>Earth → Saturn at 99% Speed of Light</h2>
    <div class="stats">
      <div class="stat"><div class="value">11 min</div><div class="label">Ship Time</div></div>
      <div class="stat"><div class="value">1 hr 20 min</div><div class="label">Earth Time</div></div>
      <div class="stat"><div class="value">886,000,000 mi</div><div class="label">Distance</div></div>
      <div class="stat"><div class="value">7.09×</div><div class="label">Time Dilation</div></div>
    </div>
  </div>
</div>
<button id="restart" onclick="startAnimation()">Replay</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- Config ---
const DURATION = 6000; // ms
const AU = 93_000_000; // miles per AU (roughly)

// Planet data: [name, distanceAU, radius (visual px at 1x zoom), color, hasRings]
const planets = [
  { name: 'Sun',     au: 0,    baseR: 18, color: '#FDB813', glow: '#FDB81350', ring: false },
  { name: 'Mercury', au: 0.39, baseR: 3,  color: '#8c7e6d', glow: null, ring: false },
  { name: 'Venus',   au: 0.72, baseR: 5,  color: '#c9a860', glow: null, ring: false },
  { name: 'Earth',   au: 1.0,  baseR: 5.5,color: '#4a90d9', glow: '#4a90d940', ring: false },
  { name: 'Mars',    au: 1.52, baseR: 4,  color: '#c1440e', glow: null, ring: false },
  { name: 'Jupiter', au: 5.2,  baseR: 12, color: '#c88b3a', glow: '#c88b3a20', ring: false },
  { name: 'Saturn',  au: 9.5,  baseR: 10, color: '#d4a94b', glow: '#d4a94b30', ring: true },
];

// Stars (parallax layers)
const starLayers = [];
for (let layer = 0; layer < 3; layer++) {
  const stars = [];
  const count = 300 + layer * 200;
  for (let i = 0; i < count; i++) {
    stars.push({
      x: (Math.random() - 0.5) * 40, // AU spread
      y: (Math.random() - 0.5) * 40,
      brightness: 0.2 + Math.random() * 0.8,
      size: 0.5 + Math.random() * (1.5 - layer * 0.3),
      twinkleSpeed: 1 + Math.random() * 3,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
  starLayers.push({ stars, parallax: 0.3 + layer * 0.35 });
}

// Camera state
let camX, camY, camZoom; // zoom = pixels per AU

// Easing: smooth in-out
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// Convert AU coords to screen coords
function toScreen(auX, auY, parallax = 1.0) {
  const dx = (auX - camX) * parallax;
  const dy = (auY - camY) * parallax;
  return {
    x: canvas.width / 2 + dx * camZoom,
    y: canvas.height / 2 + dy * camZoom,
  };
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Animation keyframes ---
// Camera path: start close to Earth, zoom out to show Earth-Saturn span
const keyframes = [
  { t: 0.0,  cx: 1.0,  cy: 0, zoom: 800 },   // tight on Earth
  { t: 0.15, cx: 1.0,  cy: 0, zoom: 600 },   // slight pull back
  { t: 0.5,  cx: 3.5,  cy: 0, zoom: 80 },    // mid solar system
  { t: 0.8,  cx: 5.5,  cy: 0, zoom: 55 },    // wide, Saturn coming in
  { t: 1.0,  cx: 5.25, cy: 0, zoom: 50 },    // settled, both visible
];

function lerpKeyframes(progress) {
  let a = keyframes[0], b = keyframes[keyframes.length - 1];
  for (let i = 0; i < keyframes.length - 1; i++) {
    if (progress >= keyframes[i].t && progress <= keyframes[i + 1].t) {
      a = keyframes[i];
      b = keyframes[i + 1];
      break;
    }
  }
  const segT = (progress - a.t) / (b.t - a.t);
  const e = easeInOutCubic(segT);
  return {
    cx: a.cx + (b.cx - a.cx) * e,
    cy: a.cy + (b.cy - a.cy) * e,
    zoom: a.zoom + (b.zoom - a.zoom) * e,
  };
}

// --- Journey trail ---
function drawTrail(progress) {
  const earthScreen = toScreen(1.0, 0);
  const saturnScreen = toScreen(9.5, 0);

  // Trail progress (ship traveling)
  const trailProgress = Math.min(1, Math.max(0, (progress - 0.1) / 0.75));
  const trailEnd = {
    x: earthScreen.x + (saturnScreen.x - earthScreen.x) * easeInOutCubic(trailProgress),
    y: earthScreen.y + (saturnScreen.y - earthScreen.y) * easeInOutCubic(trailProgress),
  };

  if (trailProgress > 0) {
    // Dashed trail line
    ctx.save();
    ctx.setLineDash([4, 8]);
    ctx.strokeStyle = 'rgba(126, 184, 255, 0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(earthScreen.x, earthScreen.y);
    ctx.lineTo(trailEnd.x, trailEnd.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Ship dot
    if (trailProgress < 0.98) {
      ctx.beginPath();
      ctx.arc(trailEnd.x, trailEnd.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#7eb8ff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(trailEnd.x, trailEnd.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(126, 184, 255, 0.15)';
      ctx.fill();
    }
    ctx.restore();
  }
}

// --- Draw functions ---
function drawStars(time, progress) {
  for (const layer of starLayers) {
    for (const star of layer.stars) {
      const pos = toScreen(star.x, star.y, layer.parallax);
      if (pos.x < -10 || pos.x > canvas.width + 10 || pos.y < -10 || pos.y > canvas.height + 10) continue;

      const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
      const alpha = star.brightness * (0.4 + 0.6 * twinkle);

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, star.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();
    }
  }
}

function drawPlanet(planet, time) {
  const pos = toScreen(planet.au, 0);
  const r = planet.baseR * (camZoom / 80); // scale with zoom
  const minR = planet.name === 'Sun' ? 4 : 1.5;
  const drawR = Math.max(minR, Math.min(r, planet.name === 'Sun' ? 60 : 30));

  // Off screen check
  if (pos.x < -100 || pos.x > canvas.width + 100 || pos.y < -100 || pos.y > canvas.height + 100) return;

  // Glow
  if (planet.glow && drawR > 3) {
    const gradient = ctx.createRadialGradient(pos.x, pos.y, drawR, pos.x, pos.y, drawR * 3);
    gradient.addColorStop(0, planet.glow);
    gradient.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, drawR * 3, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
  }

  // Planet body
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, drawR, 0, Math.PI * 2);
  ctx.fillStyle = planet.color;
  ctx.fill();

  // Saturn rings
  if (planet.ring && drawR > 3) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y, drawR * 2.2, drawR * 0.5, -0.2, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(210, 180, 120, 0.6)';
    ctx.lineWidth = Math.max(1, drawR * 0.25);
    ctx.stroke();
    // inner ring
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y, drawR * 1.7, drawR * 0.38, -0.2, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(190, 160, 100, 0.35)';
    ctx.lineWidth = Math.max(0.5, drawR * 0.15);
    ctx.stroke();
    ctx.restore();
  }

  // Label
  if (drawR > 2.5 || planet.name === 'Earth' || planet.name === 'Saturn') {
    ctx.font = `${Math.max(10, Math.min(14, drawR * 1.2))}px 'Segoe UI', system-ui, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.textAlign = 'center';
    ctx.fillText(planet.name, pos.x, pos.y + drawR + 14);
  }
}

function drawOrbitHints() {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (const p of planets) {
    if (p.au === 0) continue;
    const center = toScreen(0, 0);
    const r = p.au * camZoom;
    if (r > 5 && r < canvas.width * 3) {
      ctx.beginPath();
      ctx.arc(center.x, center.y, r, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// --- Main loop ---
let startTime = null;
let animId = null;

function frame(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;
  const progress = Math.min(1, elapsed / DURATION);
  const time = timestamp / 1000;

  // Update camera
  const cam = lerpKeyframes(progress);
  camX = cam.cx;
  camY = cam.cy;
  camZoom = cam.zoom;

  // Clear
  ctx.fillStyle = '#030308';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw
  drawStars(time, progress);
  drawOrbitHints();
  drawTrail(progress);
  for (const p of planets) drawPlanet(p, time);

  // Title card: visible at start, fades
  const titleEl = document.getElementById('title-card');
  if (progress < 0.08) {
    titleEl.classList.add('visible');
  } else if (progress < 0.2) {
    titleEl.style.opacity = 1 - (progress - 0.08) / 0.12;
  } else {
    titleEl.classList.remove('visible');
    titleEl.style.opacity = 0;
  }

  // Trip data: appears near end
  const dataEl = document.getElementById('trip-data');
  if (progress > 0.82) {
    dataEl.classList.add('visible');
  }

  if (progress < 1) {
    animId = requestAnimationFrame(frame);
  }
}

function startAnimation() {
  if (animId) cancelAnimationFrame(animId);
  startTime = null;
  document.getElementById('trip-data').classList.remove('visible');
  document.getElementById('title-card').classList.remove('visible');
  document.getElementById('title-card').style.opacity = '';
  animId = requestAnimationFrame(frame);
}

// Auto-start
startAnimation();
</script>
</body>
</html>
