# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - kg-velocity

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust CSS with commit SHA
        shell: pwsh
        run: |
          $file = "Kg.Velocity.Blazor/wwwroot/index.html"
          $sha = "${{ github.sha }}".Substring(0, 8)
          (Get-Content $file) -replace 'app\.css', "app.css?v=$sha" -replace 'Kg\.Velocity\.Blazor\.styles\.css', "Kg.Velocity.Blazor.styles.css?v=$sha" -replace 'Kg\.Velocity\.UI\.styles\.css', "Kg.Velocity.UI.styles.css?v=$sha" | Set-Content $file

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish Kg.Velocity.Api/Kg.Velocity.Api.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E3611E5A3E934528BE4981900A045129 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E24143194A3E45BDA8BB6E25C0D68E7A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_544E0ACA435448B5B76AA6EA51D8468B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kg-velocity'
          slot-name: 'Production'
          package: .
          
