<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Absurd Travel Simulator</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Kg.Velocity.UI/css/app.css" />
    <link rel="stylesheet" href="Kg.Velocity.Maui.styles.css" />
    <link rel="stylesheet" href="Kg.Velocity.UI.styles.css" />
    <link rel="icon" href="data:,">
    <style>
        .status-bar-safe-area {
            height: env(safe-area-inset-top);
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
        }
        .loading-text {
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="loading-container">
            <p class="loading-text">Initializing Flight Systems...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_content/Kg.Velocity.UI/js/embla-carousel.bundle.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
