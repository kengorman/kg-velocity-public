<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absurd Travel Simulator</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Kg.Velocity.Blazor.styles.css" rel="stylesheet" />
    <style>
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .loading-spinner {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
        }
        .loading-text {
            color: #6b7280;
            font-size: 14px;
        }
        .loading-slow {
            display: none;
            margin-top: 16px;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <img src="dualRing.gif" alt="Loading..." class="loading-spinner" />
            <div class="loading-text">Loading...</div>
            <div class="loading-slow" id="slow-message">
                Taking longer than expected.<br/>
                Please wait or try refreshing.
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    
    <script>
        // Show slow-loading message after 8 seconds
        setTimeout(function() {
            var slowMsg = document.getElementById('slow-message');
            if (slowMsg) slowMsg.style.display = 'block';
        }, 8000);
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
