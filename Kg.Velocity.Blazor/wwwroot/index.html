<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velocity — Relativistic Travel Simulation</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Kg.Velocity.Blazor.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <img src="dualRing.gif" alt="Loading..." style="width: 80px; height: 80px; margin: 20vh auto; display: block;" />
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        window.getBoundingClientRect = function (element) {
            if (element) {
                var rect = element.getBoundingClientRect();
                return {
                    left: rect.left,
                    top: rect.top,
                    width: rect.width,
                    height: rect.height
                };
            }
            return null;
        };

        window.gameLoop = {
            start: (dotNetHelper) => {
                window.gameLoop.dotNetHelper = dotNetHelper;
                window.gameLoop.loop();
            },
            stop: () => {
                window.gameLoop.dotNetHelper = null;
            },
            loop: () => {
                if (window.gameLoop.dotNetHelper) {
                    window.gameLoop.dotNetHelper.invokeMethodAsync('OnFrame');
                    requestAnimationFrame(window.gameLoop.loop);
                }
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
