    <style>
        /* Skeleton Loading Screen */
        .skeleton-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
        }
        .skeleton-header {
            height: 15px;
            width: 160px;
            background: #1a1a24;
            border-radius: 4px;
            margin: 0 auto 16px;
        }
        .skeleton-carousel {
            display: flex;
            gap: 12px;
            overflow: hidden;
            padding: 8px 0;
        }
        .skeleton-dest-card {
            flex: 0 0 200px;
            height: 145px;
            background: #12121a;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        .skeleton-speed-card {
            flex: 0 0 140px;
            height: 50px;
            background: #12121a;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        .skeleton-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 8px 0 12px;
        }
        .skeleton-dot {
            width: 6px;
            height: 6px;
            background: #2a2a3a;
            border-radius: 50%;
        }
        /* Shimmer animation */
        .skeleton-dest-card::after,
        .skeleton-speed-card::after,
        .skeleton-header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.04) 50%,
                transparent 100%
            );
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="skeleton-container">
            <div class="skeleton-header"></div>
            <!-- Destination carousel skeleton -->
            <div class="skeleton-carousel">
                <div class="skeleton-dest-card"></div>
                <div class="skeleton-dest-card"></div>
                <div class="skeleton-dest-card"></div>
            </div>
            <div class="skeleton-dots">
                <div class="skeleton-dot"></div>
                <div class="skeleton-dot"></div>
                <div class="skeleton-dot"></div>
                <div class="skeleton-dot"></div>
                <div class="skeleton-dot"></div>
            </div>
            <!-- Speed carousel skeleton -->
            <div class="skeleton-carousel">
                <div class="skeleton-speed-card"></div>
                <div class="skeleton-speed-card"></div>
                <div class="skeleton-speed-card"></div>
            </div>
            <div class="skeleton-dots">
                <div class="skeleton-dot"></div>
                <div class="skeleton-dot"></div>
                <div class="skeleton-dot"></div>
                <div class="skeleton-dot"></div>
                <div class="skeleton-dot"></div>
            </div>
        </div>
